<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
  <ui:composition template="/Admin/AdminLayout.xhtml">

    <!-- PAGE TITLE -->
    <ui:define name="title">
        All Assets
    </ui:define>

    <!-- PAGE MAIN CONTENT -->
    <ui:define name="content">

        <style>
            .assetTable {
                width: 100%;
                border-collapse: collapse;
                margin-top: 15px;
            }

            .assetTable th {
                background-color: #1e2a47;
                color: #fff;
                padding: 10px;
                border: 1px solid #444;
            }

            .assetTable td {
                padding: 10px;
                border: 1px solid #ccc;
            }

            .btn {
                background-color: #0b76d1;
                padding: 6px 12px;
                color: white;
                border: none;
                border-radius: 5px;
                margin-right: 4px;
                cursor: pointer;
                transition: .2s;
            }

            .btn:hover {
                background-color: #095fa8;
            }

            .btn.delete {
                background-color: #d33;
            }

            .btn.delete:hover {
                background-color: #b22;
            }
        </style>

        <h2>Asset List</h2>

        <h:form>

            <!-- ADD NEW ASSET -->
            <h:commandLink value="➕ Add New Asset"
                           action="AssetForm?faces-redirect=true"
                           style="font-size:16px; text-decoration:none; padding:8px; background:#337ab7; color:white; border-radius:5px;" />

            <br/><br/>

            <!-- SEARCH BAR -->
            <h:panelGroup layout="block" style="margin-bottom: 20px;">
                <h:inputText value="#{assetManagedBean.searchKeyword}"
                             style="padding:8px; width:250px; border-radius:5px; border:1px solid #777;">
                    <f:ajax event="keyup"
                            listener="#{assetManagedBean.searchAssetsAjax}"
                            render="assetTable" />
                </h:inputText>
            </h:panelGroup>

            <!-- ASSET TABLE -->
            <h:dataTable id="assetTable"
                         value="#{assetManagedBean.assetsList}"
                         var="asset"
                         styleClass="assetTable">

                <!-- ID -->
                <h:column>
                    <f:facet name="header">ID</f:facet>
                    #{asset.aid}
                </h:column>

                <!-- IMAGE -->
                <h:column>
                    <f:facet name="header">Image</f:facet>
                    <h:graphicImage library="assets"
                                    name="#{asset.symbol}"
                                    width="60"
                                    height="60"/>
                </h:column>

                <!-- NAME -->
                <h:column>
                    <f:facet name="header">Name</f:facet>
                    #{asset.name}
                </h:column>

                <!-- TYPE -->
                <h:column>
                    <f:facet name="header">Type</f:facet>
                    #{asset.type}
                </h:column>

                <!-- PRICE -->
                <h:column>
                    <f:facet name="header">Price</f:facet>
                    #{asset.currentPrice}
                </h:column>

                <!-- STATUS -->
                <h:column>
                    <f:facet name="header">Status</f:facet>
                    #{asset.status}
                </h:column>

                <!-- RISK -->
                <h:column>
                    <f:facet name="header">Risk</f:facet>
                    #{asset.risk}
                </h:column>

                <!-- CREATED AT -->
                <h:column>
                    <f:facet name="header">Created</f:facet>
                    <h:outputText value="#{asset.createdAt}">
                        <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss"/>
                    </h:outputText>
                </h:column>

                <!-- ACTIONS -->
                <h:column>
                    <f:facet name="header">Action</f:facet>

                    <h:commandButton value="Update"
                                     action="#{assetManagedBean.edit(asset.aid)}"
                                     styleClass="btn"/>

                    <h:commandButton value="Delete"
                                     action="#{assetManagedBean.deleteAsset(asset.aid)}"
                                     onclick="return confirm('Are you sure you want to delete this asset?');"
                                     styleClass="btn delete"/>

                </h:column>

            </h:dataTable>

        </h:form>

    </ui:define>

</ui:composition>
</html>
