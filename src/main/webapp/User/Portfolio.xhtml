<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>My Portfolio</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>

    <style>
        body {
            background: #f5f7fa;
        }
        .portfolio-card {
            border-radius: 15px;
            background: #ffffff;
            padding: 25px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.08);
        }
        .value-up {
            color: #0abf53;
            font-weight: bold;
        }
        .value-down {
            color: #d93025;
            font-weight: bold;
        }
        .table thead {
            background: #eef1f5;
        }
        .header-title {
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</h:head>

<h:body>

<div class="container mt-4">

    <!-- PAGE HEADER -->
    <div class="mb-4">
        <span class="header-title">📊 Your Portfolio</span>
        <p class="text-muted">Overview of your current holdings</p>
    </div>

    <div class="portfolio-card">

        <!-- Portfolio Table -->
        <h:dataTable value="#{portfolioBean.portfolioList}" var="p"
                     styleClass="table table-bordered table-hover">

            <h:column>
                <f:facet name="header">Asset</f:facet>
                <strong>#{p.aid.name}</strong><br/>
                <span class="badge text-bg-primary">#{p.aid.type}</span>
            </h:column>

            <h:column>
                <f:facet name="header">Units</f:facet>
                #{p.units}
            </h:column>

            <h:column>
                <f:facet name="header">Avg Price</f:facet>
                ₹ #{p.avgPrice}
            </h:column>

            <h:column>
                <f:facet name="header">Current Value</f:facet>
                ₹ #{p.currentValue}

                <!-- Gain/Loss style -->
                <br/>
                <span class="#{p.currentValue gt p.avgPrice ? 'value-up' : 'value-down'}">
                    #{p.currentValue gt p.avgPrice ? '▲ Gain' : '▼ Loss'}
                </span>
            </h:column>

            <h:column>
                <f:facet name="header">Last Updated</f:facet>
                <h:outputText value="#{p.updatedAt}">
                    <f:convertDateTime pattern="dd MMM yyyy | HH:mm"/>
                </h:outputText>
            </h:column>

        </h:dataTable>

        <!-- No Data Message -->
        <h:panelGroup rendered="#{empty portfolioBean.portfolioList}">
            <div class="alert alert-info text-center mt-3">
                No portfolio records found.
            </div>
        </h:panelGroup>

    </div>
</div>

</h:body>
</html>
