<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <title>Login — Portfolio SIP Manager</title>

    <style>
        /* ------------ GLOBAL LAYOUT ------------ */
        html, body {
            height: 100%;
            margin: 0;
            font-family: "Inter", sans-serif;
            background: linear-gradient(180deg, #e9f2ff 0%, #f6fbff 60%);
            display: flex;
            flex-direction: column;
        }

        /* MAIN PAGE AREA */
        .page-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 16px;
            position: relative;
            overflow: hidden;
        }

        /* ------------ BACKGROUND FLOATING SHAPES ------------ */
        .shape-large {
            position: absolute;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(95,155,255,0.35), rgba(185,215,255,0.1));
            border-radius: 50%;
            top: -120px;
            left: -80px;
            filter: blur(70px);
        }

        .shape-small {
            position: absolute;
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(135,175,255,0.30), rgba(205,225,255,0.08));
            border-radius: 50%;
            bottom: -80px;
            right: -60px;
            filter: blur(60px);
        }

        /* ------------ GLASS LOGIN CARD ------------ */
        .login-card {
            width: 420px;
            padding: 42px;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(20px);
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.35);
            box-shadow: 0 18px 45px rgba(20,60,140,0.18);
            animation: fadeUp 0.8s ease;
            position: relative;
            z-index: 2;
            margin-top: 6%;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-title {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(90deg ,#0b69ff,#007bff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .login-sub {
            text-align: center;
            font-size: 15px;
            margin-bottom: 26px;
            color: #244a73;
            opacity: 0.8;
        }

        /* ------------ FORM INPUTS ------------ */
        .form-label {
            display: block;
            margin-top: 16px;
            font-weight: 600;
            color: #083560;
        }

        .input {
            width: 100%;
            margin-top: 6px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255,255,255,0.75);
            border: 1px solid #c0d4f7;
            outline: none;
            font-size: 15px;
            transition: 0.25s;
        }

        .input:focus {
            border-color: #0b69ff;
            box-shadow: 0 0 6px rgba(11,105,255,0.4);
        }

        /* ------------ BUTTON ------------ */
        .btn-login {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            margin-top: 28px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            color: white;
            background: linear-gradient(90deg,#0b69ff,#007bff);
            box-shadow: 0 5px 18px rgba(11,105,255,0.35);
            transition: 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(11,105,255,0.45);
        }

        /* ------------ ERROR MESSAGE ------------ */
        .error-msg {
            text-align: center;
            margin-top: 10px;
            font-weight: 700;
            color: #d62828;
        }

        /* ------------ FOOTER ------------ */
        .footer {
            text-align: center;
            padding: 20px;
            margin-top: auto;
            color: #5e6c7c;
            font-size: 14px;
        }
    </style>
</h:head>

<h:body>

    <ui:include src="/Navbar.xhtml"/>

    <div class="page-content">

        <!-- BACKGROUND EFFECTS -->
        <div class="shape-large"></div>
        <div class="shape-small"></div>

        <!-- LOGIN CARD -->
        <div class="login-card">
            <div class="login-title">Welcome Back</div>
            <div class="login-sub">Sign in to continue your smart portfolio journey</div>

            <div id="clientError" class="error-msg" style="display:none;"></div>

            <!-- ERROR FROM BACKEND -->
            <h:panelGroup rendered="#{not empty keepRecord.errorStatus}">
                <div class="error-msg">#{keepRecord.errorStatus}</div>
            </h:panelGroup>

            <!-- LOGIN FORM -->
            <form method="POST">

                <label class="form-label">Email</label>
                <input type="text" id="email" name="email" class="input" placeholder="Enter your email" />

                <label class="form-label">Password</label>
                <input type="password" id="password" name="password" class="input" placeholder="Enter your password" />

                <button type="submit" class="btn-login">Login</button>

            </form>
        </div>
    </div>

    <div class="footer">
        © 2025 Portfolio SIP Manager — All Rights Reserved
    </div>

    <script>
        /* CLIENT-SIDE VALIDATION */
        document.querySelector("form").addEventListener("submit", function(e) {
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value.trim();
            let msg = "";

            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "") msg = "Email is required";
            else if (!emailPattern.test(email)) msg = "Enter a valid email";
            else if (password === "") msg = "Password is required";

            if (msg !== "") {
                document.getElementById("clientError").innerText = msg;
                document.getElementById("clientError").style.display = "block";
                e.preventDefault();
            }
        });
    </script>

</h:body>
</html>
