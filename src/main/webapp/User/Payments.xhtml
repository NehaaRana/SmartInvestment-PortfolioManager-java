<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
    <h:head>
        <title>My Payments</title>
        
         <style>
           .payment-container {
                margin-left: 250px; /* sidebar */
                margin-top: 90px;   /* FIX: push below navbar */
                padding: 30px;
                font-family: Poppins, sans-serif;
            }


            /* PAGE TITLE */
            .page-title {
                font-size: 26px;
                font-weight: 700;
                margin-bottom: 25px;
                color: #333;
            }

            /* CARD WRAPPER */
            .card-box {
                background: #fff;
                padding: 25px;
                border-radius: 14px;
                box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            }

            /* STATUS COLORS */
            .status-paid {
                font-weight: bold;
                color: green;
            }
            .status-pending {
                font-weight: bold;
                color: orange;
            }
            .status-failed {
                font-weight: bold;
                color: red;
            }
        </style>
    </h:head>
    <h:body>
        <ui:include src="/Navbar.xhtml"/>
        <!-- =============== SIDEBAR INCLUDE =============== -->
        <ui:include src="/Sidebar.xhtml"/>
            <div class="payment-container">

        <h2>My Payments</h2>
        
        <div class="card-box">
        <h:form id="paymentForm">

        <p:dataTable value="#{paymentBean.paymentsList}" var="p"
                     paginator="true" rows="10"
                     emptyMessage="No Payments Found">

            <p:column headerText="Payment ID">
                #{p.pid}
            </p:column>

            <p:column headerText="Transaction ID">
                #{p.tid.tid}
            </p:column>

            <p:column headerText="Method">
                #{p.method}
            </p:column>

            <p:column headerText="Reference No">
                #{p.referenceNo}
            </p:column>

            <p:column headerText="Status">
                <span style="color:green;font-weight:bold">
                    #{p.status}
                </span>
            </p:column>

            <p:column headerText="Date">
                        <h:outputText value="#{p.createdAt}">
                            <f:convertDateTime pattern="dd-MM-yyyy hh:mm a"/>
                        </h:outputText>
                    </p:column>

        </p:dataTable>

        </h:form>
        </div>

    </div>

    </h:body>
</html>
