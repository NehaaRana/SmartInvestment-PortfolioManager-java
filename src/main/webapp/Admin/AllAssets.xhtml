<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <h:head>
        <title>All Assets</title>
        <style>
            .assetTable {
                width: 100%;
                border: 2px solid #444;
                border-collapse: collapse;
                text-align: center;
            }

            .assetTable th, .assetTable td {
                border: 1px solid #444;
                padding: 8px;
            }


        </style>
    </h:head>
    <h:body>
           <h2>All Asset List</h2>

    <h:form>
          <!-- ADD ASSET BUTTON -->
        <h:commandLink value="Add New Asset" action="AssetForm?faces-redirect=true" />
        <br/><br/>
        <h:dataTable value="#{assetManagedBean.assetsList}" var="asset" styleClass="assetTable">

            <h:column>
                <f:facet name="header">Aid</f:facet>
                #{asset.aid}
            </h:column>

            <h:column>
                <f:facet name="header">Symbol</f:facet>
                #{asset.symbol}
            </h:column>

            <h:column>
                <f:facet name="header">Name</f:facet>
                #{asset.name}
            </h:column>
            
            <h:column>
                <f:facet name="header">Type</f:facet>
                #{asset.type}
            </h:column>

            <h:column>
                <f:facet name="header">Current Price</f:facet>
                #{asset.currentPrice}  <!-- getter is getCurrentPrice() -->
            </h:column>

            <h:column>
                <f:facet name="header">Status</f:facet>
                #{asset.status}
            </h:column>

            <h:column>
                <f:facet name="header">Risk</f:facet>
                #{asset.risk}
            </h:column>

            <h:column>
                <f:facet name="header">Created At</f:facet>
                <h:outputText value="#{asset.createdAt}">
                    <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss" />
                </h:outputText>
            </h:column>
            
            
            <h:column>
                <f:facet name="header">Action</f:facet>
                <h:commandButton value="Update" action="#{assetManagedBean.edit(asset.aid)}"/>
                <h:commandButton value="Delete"
                    action="#{assetManagedBean.deleteAsset(asset.aid)}"
                    onclick="return confirm('Are you sure you want to delete?');"/>
            </h:column>

        </h:dataTable>
    </h:form>
        
<!--        <h3>Debug Session Values</h3>

        <p>Email: <h:outputText value="#{keepRecord.email}" /></p>
        <p>Token: <h:outputText value="#{keepRecord.token}" /></p>
        <p>Principal: <h:outputText value="#{keepRecord.principal.name}" /></p>
        <p>Roles: <h:outputText value="#{keepRecord.roles}" /></p>
        <p>Result: <h:outputText value="#{keepRecord.result.status}" /></p>-->

    </h:body>
</html>
