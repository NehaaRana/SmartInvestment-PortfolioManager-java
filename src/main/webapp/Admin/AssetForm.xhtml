<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <h:head>
        <title>Add Asset</title>
    </h:head>
    <h:body>
    <h2>All Asset List</h2>

    <h:form>
        <h1><h:outputText value="List"/></h1>

        <h:dataTable value="#{assetManagedBean.assetsList}" styleClass="assetTable" var="asset">

            <h:column>
                <f:facet name="header">Aid</f:facet>
                #{asset.aid}
            </h:column>

            <h:column>
                <f:facet name="header">Symbol</f:facet>
                #{asset.symbol}
            </h:column>

            <h:column>
                <f:facet name="header">Name</f:facet>
                #{asset.name}
            </h:column>

            <h:column>
                <f:facet name="header">Action</f:facet>

                <!-- Update -->
                <h:commandButton value="Update" action="#{assetManagedBean.edit(asset.aid)}" />

                <!-- Delete -->
                <h:commandButton value="Delete"
                                 action="#{assetManagedBean.deleteAsset(asset.aid)}"
                                 onclick="return confirm('Are you sure you want to delete this Asset ?');"/>
            </h:column>

        </h:dataTable>
    </h:form>

</h:body>

</html>
