<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">

<h:head>
    <title>Login — Portfolio SIP Manager</title>

    <style>
        body {
            margin: 0;
            font-family: "Inter", "Poppins", sans-serif;
            background: linear-gradient(180deg, #dceaff 0%, #f3f8ff 60%);
            color: #042a52;
        }

        /* TOP NAV BAR */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 35px;
            background: rgba(255,255,255,0.7);
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            backdrop-filter: blur(8px);
        }

        .brand {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(90deg,#0b69ff,#00a8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .menu a {
            text-decoration: none;
            padding: 8px 14px;
            color: #083560;
            font-weight: 600;
        }

        .menu a:hover {
            color: #0b69ff;
        }

        /* LOGIN BOX */
        .login-box {
            width: 420px;
            margin: 80px auto;
            background: rgba(255,255,255,0.85);
            padding: 38px;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(10,60,130,0.15);
            border: 1px solid rgba(0,98,255,0.18);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 800;
            color: #042a52;
        }

        label {
            font-weight: 600;
            margin-top: 14px;
            display: block;
            color: #052542;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 10px;
            border: 1px solid #bcd2f0;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #0b69ff;
            box-shadow: 0 0 6px rgba(11,105,255,0.4);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #0b69ff;
            color: white;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            margin-top: 22px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #044fbe;
        }

        .error-msg {
            color: red;
            text-align: center;
            margin-top: 10px;
            font-weight: 700;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: #6b7b8a;
        }
    </style>
</h:head>

<h:body>

    <!-- TOP BAR -->
    <div class="topbar">
        <div class="brand">Portfolio SIP Manager</div>

        <div class="menu">
            <a href="index.jsf">Home</a>
            <a href="User/ViewPlans.jsf">SIP Plans</a>
            <a href="About.jsf">About</a>
        </div>
    </div>

    <!-- LOGIN FORM (PURE HTML) -->
    <div class="login-box">
        <h2>Sign In</h2>

        <form method="POST">

            <!-- Error message from your bean -->
            <h:panelGroup rendered="#{not empty userManageBean.msg}">
                <div class="error-msg">#{userManageBean.msg}</div>
            </h:panelGroup>

            <label>Email</label>
            <input type="text" name="email" placeholder="Enter your email" />

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" />

            <button type="submit" class="btn">Login</button>

        </form>
    </div>

    <div class="footer">
        © 2025 Portfolio SIP Manager — All Rights Reserved
    </div>

</h:body>
</html>
