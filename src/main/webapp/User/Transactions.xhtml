<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">
    <h:head>
        <title>My Transactions</title>
          <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>

    <style>
        body {
            background: #f5f7fa;
            font-family: "Inter", "Poppins", sans-serif;
        }

        .main-content {
            margin-top: 80px;
            margin-left: 260px;
            padding: 20px;
            transition: margin-left 0.3s;
        }

        .collapsed-main {
            margin-left: 80px;
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
        }

        .card-box {
            background: #ffffff;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        .status-success {
            color: #0abf53;
            font-weight: bold;
        }

        .status-failed {
            color: #d93025;
            font-weight: bold;
        }

        .status-pending {
            color: orange;
            font-weight: bold;
        }

        .table thead {
            background: #eef1f5;
        }

        .table td, .table th {
            vertical-align: middle;
        }
    </style>

    <script>
        function adjustContent() {
            const sidebar = document.getElementById("sidebar");
            const content = document.getElementById("main-content");

            if (sidebar.classList.contains("collapsed")) {
                content.classList.add("collapsed-main");
            } else {
                content.classList.remove("collapsed-main");
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            setInterval(adjustContent, 200);
        });
    </script>
    </h:head>
    <h:body>
        <ui:include src="/Navbar.xhtml"/>
        <!-- =============== SIDEBAR INCLUDE =============== -->
        <ui:include src="/Sidebar.xhtml"/>
    <div id="main-content" class="main-content">

                 <div class="mb-4">
                    <span class="header-title">My Transactions</span>
                    <p class="text-muted">Overview of all your transactions</p>
                </div>
        
        <div class="card-box">

            <h:form id="txForm">

            <p:dataTable value="#{transactionBean.transactionList}" var="t"
                         paginator="true" rows="10"
                         emptyMessage="No Transactions Found">

                <p:column headerText="Txn ID">
                    #{t.tid}
                </p:column>

                <p:column headerText="Order ID">
                    #{t.oid.oid}
                </p:column>

                <p:column headerText="Amount">
                    #{t.amount}
                </p:column>

                <p:column headerText="Type">
                    #{t.txnType}
                </p:column>

                <p:column headerText="Status">
                        <span class="#{t.status eq 'SUCCESS' ? 'status-success' :
                                      t.status eq 'PENDING' ? 'status-pending' :
                                      'status-failed'}">
                            #{t.status}
                        </span>
                    </p:column>

                <p:column headerText="Date">
                             <h:outputText value="#{t.createdAt}">
                                 <f:convertDateTime pattern="dd-MM-yyyy hh:mm a"/>
                             </h:outputText>
                </p:column>

            </p:dataTable>

        </h:form>
        </div>
    </div>

    </h:body>
</html>
