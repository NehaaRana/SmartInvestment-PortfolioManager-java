<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <h:head>
        <title>All Assets</title>
        <style>
            .assetTable {
                width: 100%;
                border: 2px solid #444;
                border-collapse: collapse;
                text-align: center;
            }

            .assetTable th, .assetTable td {
                border: 1px solid #444;
                padding: 8px;
            }


        </style>
    </h:head>
    <h:body>
        <h2>All Asset List</h2>
        <h:form>
            <f:view>


                <h:form>
                    <h1><h:outputText value="List"/></h1>
                    <h:dataTable value="#{assetManagedBean.assetsList}" styleClass="assetTable" var="asset">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Aid"/>
                            </f:facet>
                            <h:outputText value="#{asset.aid}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Symbol"/>
                            </f:facet>
                            <h:outputText value="#{asset.symbol}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Name"/>
                            </f:facet>
                            <h:outputText value="#{asset.name}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Type"/>
                            </f:facet>
                            <h:outputText value="#{asset.type}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="CurrentPrice"/>
                            </f:facet>
                            <h:outputText value="#{asset.currentPrice}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Status"/>
                            </f:facet>
                            <h:outputText value="#{asset.status}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Risk"/>
                            </f:facet>
                            <h:outputText value="#{asset.risk}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="CreatedAt"/>
                            </f:facet>
                            <h:outputText value="#{asset.createdAt}">
                                <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                            </h:outputText>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Action" /><!-- comment -->
                             </f:facet>
                                <!--Delete Button-->
                            <h:commandButton value="Delete"  action="#{assetManagedBean.deleteAsset(asset.aid)}" 
                            onclick="return confirm('Are you sure you want to delete this Asset ?');"/>
                           
                        </h:column>
                    </h:dataTable>
                </h:form>
            </f:view>

        </h:form>
    </h:body>
</html>
