<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
<ui:composition template="/Admin/AdminLayout.xhtml">

    <!-- PAGE TITLE -->
    <ui:define name="title">
        User List
    </ui:define>

    <!-- MAIN CONTENT -->
<ui:define name="content">

    <style>
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 600;
            color: #1e2a47;
        }

        .user-badge {
            background: #0b76d1;
            padding: 6px 12px;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .search-input {
            width: 260px;
        }
    </style>

    <h:form id="userForm">

        <!-- HEADER + BADGE -->
        <div class="page-header">
           
            <span class="user-badge">
                Total Users: #{userManagedBean.userList.size()}
            </span>
        </div>



        <br/><br/>
        <p:confirmDialog global="true"
                 showEffect="fade"
                 hideEffect="fade"
                 closable="false">

            <p:commandButton value="Yes"
                             type="button"
                             styleClass="ui-confirmdialog-yes p-button-success" />

            <p:commandButton value="No"
                             type="button"
                             styleClass="ui-confirmdialog-no p-button-danger" />

        </p:confirmDialog>

        <!-- PRIMEFACES DATATABLE -->
        <p:dataTable id="userTable"
                     var="u"
                     widgetVar="userTable"
                     value="#{userManagedBean.userList}"
                     paginator="true"
                     rows="10"
                     rowsPerPageTemplate="5,10,20"
                     stripedRows="true"
                     rowKey="#{u.uid}"
                     emptyMessage="No users found">

            <!-- UID -->
            <p:column headerText="UID"
                      sortBy="#{u.uid}"
                      filterBy="#{u.uid}">
                #{u.uid}
            </p:column>

            <!-- Full Name -->
            <p:column headerText="Full Name"
                      sortBy="#{u.fullName}"
                      filterBy="#{u.fullName}">
                #{u.fullName}
            </p:column>

            <!-- Email -->
            <p:column headerText="Email"
                      sortBy="#{u.email}"
                      filterBy="#{u.email}">
                #{u.email}
            </p:column>

            <!-- Actions -->
            <p:column headerText="Action" style="width:180px;">

                <p:commandButton value="Delete"
                                 icon="pi pi-trash"
                                 action="#{userManagedBean.deleteUser(u.uid)}"
                                 update="@form"
                                 styleClass="btn btn-danger"
                                 >
                                <p:confirm header="Delete Confirmation"
                              message="Are you sure you want to delete this user?"
                              icon="pi pi-exclamation-triangle" />

               </p:commandButton>
            </p:column>

        </p:dataTable>

    </h:form>

</ui:define>


</ui:composition>
</html>
