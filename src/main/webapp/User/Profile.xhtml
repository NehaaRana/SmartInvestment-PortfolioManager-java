<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
   
    <h:head>
        <title>User Profile</title>
        
    <!-- Bootstrap -->
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />

    <style>
        body {
            background: #f0f2f5;
            font-family: "Poppins", sans-serif;
        }

        .page-content {
            margin-top: 90px;
            margin-left: 260px;
            padding: 20px;
            display: flex;
            justify-content: center;
            transition: margin-left 0.3s;
        }

        .collapsed-main {
            margin-left: 80px;
        }

        .profile-card {
            width: 850px;
            border-radius: 20px;
            background: #ffffff;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .profile-card h2 {
            font-weight: bold;
            color: #333;
        }

        .form-label {
            font-weight: 500;
        }

        .btn-primary {
            background-color: #1976d2;
            border-color: #1976d2;
        }

        .btn-primary:hover {
            background-color: #125aa3;
            border-color: #125aa3;
        }
    </style>

    <script>
        function adjustContent() {
            var sidebar = document.getElementById("sidebar");
            var content = document.querySelector(".page-content");

            if (sidebar) {
                if (sidebar.classList.contains("collapsed")) {
                    content.classList.add("collapsed-main");
                } else {
                    content.classList.remove("collapsed-main");
                }
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            setInterval(adjustContent, 200);
        });
    </script>

    
    </h:head>

    <h:body style="background:#f0f2f5">
        <ui:include src="/Navbar.xhtml"/>
        <!-- =============== SIDEBAR INCLUDE =============== -->
        <ui:include src="/Sidebar.xhtml"/>
        
        
         <div class="page-content">
            <div class="card shadow-lg p-4 profile-card" style="border-radius: 20px;">
                <h2 class="text-center mb-4">My Profile</h2>

                <h:form>

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <h:inputText value="#{profileBean.fullName}" 
                                     required="true"
                                     class="form-control"/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email (Read Only)</label>
                        <h:inputText value="#{profileBean.email}" 
                                     readonly="true"
                                     class="form-control"/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <h:inputText value="#{profileBean.phone}" 
                                     required="true"
                                     class="form-control"/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">New Password (optional)</label>
                        <h:inputSecret value="#{profileBean.password}" 
                                       class="form-control"/>
                    </div>

                    <h:commandButton value="Update Profile"
                                     action="#{profileBean.updateProfile}"
                                     class="btn btn-primary w-100 mt-3"/>

                </h:form>
            </div>
        </div>

    </h:body>
</html>
