<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <title>Admin Panel</title>

    <ui:insert name="head" />

    <style>

        body {
            margin: 0;
            font-family: "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(120deg, #f7faff, #eef3ff);
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            height: 100vh;
            background: linear-gradient(160deg, #1e2a47, #253559);
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding: 25px 20px;
            transition: width 0.3s ease;
            box-shadow: 4px 0 12px rgba(0,0,0,0.15);
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* FULL COLLAPSED SIDEBAR */
        .sidebar.collapsed {
            width: 70px;
        }

        /* Logo */
        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 35px;
            text-align: center;
            transition: opacity .3s, transform .3s;
        }

        .sidebar.collapsed .logo {
            opacity: 0;
            transform: scale(0.5);
            height: 0;
            margin: 0;
            overflow: hidden;
        }

        /* MENU */
        .sidebar ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        .sidebar li {
            margin-bottom: 12px;
        }

        .sidebar a {
            color: #c7d1ea;
            text-decoration: none;
            font-size: 16px;
            padding: 12px 14px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.25s;
            white-space: nowrap;
        }

        .sidebar a:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
            transform: translateX(4px);
        }

        /* TEXT HIDE ON COLLAPSE */
        .sidebar.collapsed a span.menu-text {
            display: none;
        }

        /* ICON alignment when collapsed */
        .menu-icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        /* LOGOUT button */
        .logout-container {
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .logout-btn {
            width: 100%;
            background: #ff4d4d;
            color: #fff;
            padding: 12px 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s ease;
            box-shadow: 0 4px 10px rgba(255,0,0,0.25);
        }

        .logout-btn:hover {
            background: #d93636;
            transform: translateY(-2px);
        }

        /* MAIN CONTENT */
        .main {
            margin-left: 260px;
            height: 100vh;
            overflow-y: auto;
            padding: 25px 35px;
            transition: margin-left 0.3s ease;
        }

        .main.collapsed {
            margin-left: 70px;
        }

        /* TOP BAR */
        .top-bar {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .toggle-btn {
            background: #1e2a47;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 18px;
            margin-right: 20px;
            transition: .3s;
        }

        .toggle-btn:hover {
            background: #253559;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1e293b;
        }
        /* ACTIVE MENU ITEM */
.sidebar a.active {
    background: rgba(255,255,255,0.18);
    color: #ffffff !important;
    font-weight: 600;
    border-left: 4px solid #4e8cff;
    padding-left: 10px;
}

.sidebar.collapsed a.active {
    border-left: 4px solid #4e8cff;
    padding-left: 14px;
}

    </style>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const main = document.getElementById("main");

            sidebar.classList.toggle("collapsed");
            main.classList.toggle("collapsed");
        }
        document.addEventListener("DOMContentLoaded", function () {
    const current = window.location.pathname;

    document.querySelectorAll(".sidebar a").forEach(link => {
        if (current.includes(link.getAttribute("href"))) {
            link.classList.add("active");
        }
    });
});

    </script>
</h:head>

<h:body>

    <!-- SIDEBAR -->
    <div id="sidebar" class="sidebar">

        <div class="logo">Admin Panel</div>

        <ul>
            <li>
                <h:link outcome="/Admin/AdminDashboard">
                    <span class="menu-icon pi pi-home"></span>
                    <span class="menu-text">Dashboard</span>
                </h:link>
            </li>

            <li>
                <h:link outcome="/Admin/UserList">
                    <span class="menu-icon pi pi-users"></span>
                    <span class="menu-text">Manage Users</span>
                </h:link>
            </li>

            <li>
                <h:link outcome="/Admin/AllAssets">
                    <span class="menu-icon pi pi-briefcase"></span>
                    <span class="menu-text">Manage Assets</span>
                </h:link>
            </li>

            <li>
                <h:link outcome="/Admin/OrderList">
                    <span class="menu-icon pi pi-shopping-cart"></span>
                    <span class="menu-text">Manage Orders</span>
                </h:link>
            </li>

            <li>
                <h:link outcome="/Admin/TransactionList">
                    <span class="menu-icon pi pi-list"></span>
                    <span class="menu-text">Manage Transaction</span>
                </h:link>
            </li>

            <li>
                <h:link outcome="/Admin/PaymentList">
                    <span class="menu-icon pi pi-credit-card"></span>
                    <span class="menu-text">Manage Payment</span>
                </h:link>
            </li>

            <li>
                <h:link outcome="/Admin/WithDrawlList">
                    <span class="menu-icon pi pi-money-bill"></span>
                    <span class="menu-text">Manage Withdrawals</span>
                </h:link>
            </li>

            <li>
                <h:link outcome="/Admin/PayoutList">
                    <span class="menu-icon pi pi-wallet"></span>
                    <span class="menu-text">Manage Payouts</span>
                </h:link>
            </li>
        </ul>

        <!-- Logout -->
        <div class="logout-container">
            <h:form>
                <h:commandButton value="Logout" action="#{userDashboardBean.logout}" styleClass="logout-btn" />
            </h:form>
        </div>

    </div>

    <!-- MAIN SECTION -->
    <div id="main" class="main">
        <div class="top-bar">
            <button class="toggle-btn" onclick="toggleSidebar()">=</button>
            <h1><ui:insert name="title">Page Title</ui:insert></h1>
        </div>

        <ui:insert name="content" />
    </div>

</h:body>

</html>
