<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
   
    <h:head>
        <title>User Profile</title>
        <link rel="stylesheet" 
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    </h:head>

    <h:body style="background:#f0f2f5">

        <div class="container mt-5">
            <div class="card shadow-lg p-4" style="border-radius: 20px;">
                <h2 class="text-center mb-4">My Profile</h2>

                <h:form>

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <h:inputText value="#{profileBean.fullName}" 
                                     required="true"
                                     class="form-control"/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email (Read Only)</label>
                        <h:inputText value="#{profileBean.email}" 
                                     readonly="true"
                                     class="form-control"/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <h:inputText value="#{profileBean.phone}" 
                                     required="true"
                                     class="form-control"/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">New Password (optional)</label>
                        <h:inputSecret value="#{profileBean.password}" 
                                       class="form-control"/>
                    </div>

                    <h:commandButton value="Update Profile"
                                     action="#{profileBean.updateProfile}"
                                     class="btn btn-primary w-100 mt-3"/>

                </h:form>
            </div>
        </div>

    </h:body>
</html>
