<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
   <ui:composition template="/Admin/AdminLayout.xhtml">

    <!-- PAGE TITLE -->
    <ui:define name="title">
        Payouts List
    </ui:define>

    <!-- MAIN CONTENT -->
   <ui:define name="content">

        <style>
            .page-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 20px;
            }

            .page-title {
                font-size: 22px;
                font-weight: 600;
                color: #1e2a47;
            }

            .payout-badge {
                background: #0b76d1;
                padding: 4px 10px;
                border-radius: 6px;
                color: white;
                font-weight: 600;
                font-size: 14px;
            }

            .search-input {
                width: 260px;
            }

            .status-badge {
                padding: 6px 12px;
                border-radius: 6px;
                color: #fff;
                font-weight: bold;
                white-space: nowrap;
                display: inline-block;
            }

            .SUCCESS { background: #28a745; }
            .FAILED  { background: #d9534f; }
            .PENDING { background: #ffc107; color: #000; }
        </style>

        <h:form id="payoutForm">

            <!-- HEADER -->
            <div class="page-header">
                <div class="page-title">Payouts List</div>

                <span class="payout-badge">
                    Total Payouts: #{payoutBean.payoutList.size()}
                </span>
            </div>

<!--             SEARCH BAR 
            <p:inputText id="globalFilter"
                         placeholder="Search payouts..."
                         styleClass="search-input"
                         onkeyup="PF('payoutTable').filter()" />-->

            <br/><br/>

            <!-- PAYOUTS TABLE -->
            <p:dataTable id="payoutTable"
                         var="p"
                         widgetVar="payoutTable"
                         value="#{payoutBean.payoutList}"
                         paginator="true"
                         rows="10"
                         rowsPerPageTemplate="5,10,20"
                         stripedRows="true"
                         rowKey="#{p.payId}"
                         emptyMessage="No payout records found">

                <!-- PAYOUT ID -->
                <p:column headerText="Payout ID" sortBy="#{p.payId}" filterBy="#{p.payId}">
                    #{p.payId}
                </p:column>

                <!-- USER -->
                <p:column headerText="User" sortBy="#{p.uid.fullName}" filterBy="#{p.uid.fullName}">
                    #{p.uid.fullName} <br/>
                    <small>(UID: #{p.uid.uid})</small>
                </p:column>

                <!-- REDEMPTION ID -->
                <p:column headerText="Redemption ID" sortBy="#{p.rid.rid}" filterBy="#{p.rid.rid}">
                    #{p.rid.rid}
                </p:column>
                
                 <!-- REDEMPTION ID -->
                <p:column headerText="Asset" sortBy="#{p.rid.aid.name}" filterBy="#{p.rid.aid.name}">
                    #{p.rid.aid.name}
                </p:column>

                <!-- AMOUNT -->
                <p:column headerText="Amount" sortBy="#{p.amount}">
                    ₹ #{p.amount}
                </p:column>

                <!-- REFERENCE NUMBER -->
                <p:column headerText="Reference No" sortBy="#{p.referenceNo}" filterBy="#{p.referenceNo}">
                    #{p.referenceNo}
                </p:column>

                <!-- STATUS -->
                <p:column headerText="Status" filterBy="#{p.status}">
                    <span class="status-badge #{p.status}">
                        #{p.status}
                    </span>
                </p:column>

                <!-- DATE -->
                <p:column headerText="Date" sortBy="#{p.createdAt}">
                    <h:outputText value="#{p.createdAt}">
                        <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss"/>
                    </h:outputText>
                </p:column>

            </p:dataTable>

        </h:form>

    </ui:define>


</ui:composition>
</html>
