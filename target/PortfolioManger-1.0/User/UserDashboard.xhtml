<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
    <h:head>
        <title>User Dashboard</title>
    </h:head>
    <h:body>
         <h2 style="color: darkgreen;">User Dashboard</h2>

        <h3>Welcome, #{sessionScope.username} (USER)</h3>

        <h:form>
            <h:commandButton value="Logout" action="#{userManageBean.logout}" />
        </h:form>

        <h4>User Options:</h4>
        <ul>
            <li><h:link outcome="profile" value="Edit Profile"/></li>
            <li><h:link outcome="my-orders" value="My Orders"/></li>
        </ul>
    </h:body>
</html>
