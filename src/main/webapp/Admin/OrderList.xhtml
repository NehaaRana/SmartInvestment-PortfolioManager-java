<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">

<ui:composition template="/Admin/AdminLayout.xhtml">
    <ui:define name="title">
        Order List
    </ui:define>
    <ui:define name="content">

        <h:head>
            <title>All Orders</title>

            <style>
                body {
                    font-family: Arial, sans-serif;
                    padding: 20px;
                }

                .orderTable {
                    width: 100%;
                    border-collapse: collapse;
                    margin-top: 15px;
                }

                .orderTable th {
                    background-color: #333;
                    color: #fff;
                    padding: 10px;
                    border: 1px solid #555;
                }

                .orderTable td {
                    padding: 10px;
                    border: 1px solid #aaa;
                }

                .btn {
                    background-color: #2c7;
                    padding: 6px 12px;
                    color: white;
                    border: none;
                    border-radius: 5px;
                    margin-right: 4px;
                }

                .btn.delete {
                    background-color: #d33;
                }

                h2 {
                    margin-bottom: 20px;
                }
                
                .badge {
                    padding: 6px 10px;
                    border-radius: 6px;
                    color: white;
                    font-weight: bold;
                }
                .pending { background: orange; }
                .completed { background: green; }
                .cancelled { background: red; }
            </style>
        </h:head>

        <h:body>

            <h2>Orders List</h2>

            <h:form id="orderForm">

                <h:dataTable value="#{orderManagedBean.orderList}" 
                             var="o" 
                             styleClass="orderTable">

                    <h:column>
                        <f:facet name="header">Order ID</f:facet>
                        #{o.oid}
                    </h:column>

                    <h:column>
                        <f:facet name="header">User Name</f:facet>
                        #{o.uid.fullName}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Asset</f:facet>
                        #{o.aid.name}
                    </h:column>

                    <h:column>
                        <f:facet name="header">OrderType</f:facet>
                        #{o.orderType}
                    </h:column>
                    
                    <h:column>
                        <f:facet name="header">Units</f:facet>
                        #{o.units}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Price</f:facet>
                        #{o.amount}
                    </h:column>
                    
                    <h:column>
                        <f:facet name="header">Status</f:facet>

                        <span style="
                            padding:5px 10px;
                            border-radius:6px;
                            color:white;
                            background-color:
                                #{o.status eq 'PENDING' ? 'orange' :
                                  o.status eq 'COMPLETED' ? 'green' :
                                  o.status eq 'CANCELLED' ? 'red' : 'grey'};">
                            #{o.status}
                        </span>
                    </h:column>

                    <h:column>
                        <f:facet name="header">CreatedAt Date</f:facet>
                        <h:outputText value="#{o.createdAt}">
                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss"/>
                        </h:outputText>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Actions</f:facet>
                           



                            <h:commandButton value="Delete"
                                         action="#{orderManagedBean.deleteOrder(o.orderId)}"
                                         onclick="return confirm('Are you sure you want to delete this order?');"
                                         styleClass="btn delete" />

                    </h:column>

                </h:dataTable>

            </h:form>

        </h:body>

    </ui:define>

</ui:composition>
</html>
