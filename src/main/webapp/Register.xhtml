<?xml version='1.0' encoding='UTF-8'?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <title>Create Account — Portfolio SIP Manager</title>

    <style>
        body {
            margin:0;
            font-family: "Inter", "Poppins", sans-serif;
            background: linear-gradient(180deg, #e9f2ff 0%, #f6fbff 60%);
            color:#05203a;
        }

        /* topbar same as index */
        .topbar {
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:12px 28px;
            background: linear-gradient(90deg, rgba(255,255,255,0.7), rgba(255,255,255,0.5));
            box-shadow: 0 6px 20px rgba(6,30,63,0.06);
        }

        .brand {
            font-weight:800;
            font-size:20px;
            color:#042a52;
            background: linear-gradient(90deg,#0b69ff,#00a8ff);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        /* glass form box */
        .register-box {
            max-width: 520px;
            margin: 60px auto;
            padding: 32px;
            border-radius:18px;
            background: linear-gradient(180deg, rgba(255,255,255,0.82), rgba(255,255,255,0.7));
            box-shadow: 0 10px 34px rgba(10,50,120,0.08);
            border: 1px solid rgba(11,105,255,0.12);
            animation: fadeIn 0.7s ease;
        }

        @keyframes fadeIn {
            0% { opacity:0; transform:translateY(-20px); }
            100% { opacity:1; transform:translateY(0); }
        }

        .title {
            text-align:center;
            font-size:28px;
            font-weight:800;
            color:#042a52;
            margin-bottom:8px;
        }

        .subtitle {
            text-align:center;
            color:#5a7184;
            margin-bottom:22px;
            font-size:15px;
        }

        .label {
            font-weight:600;
            color:#042a52;
        }

        a {
            color:#0b69ff;
            font-weight:600;
            text-decoration:none;
        }
        a:hover {
            text-decoration:underline;
        }
    </style>
</h:head>

<h:body>

     <!-- NAV -->
    <ui:include src="/Navbar.xhtml"/>


    <!-- REGISTER FORM -->
    <div class="register-box">

        <div class="title">Create Your Account</div>
        <div class="subtitle">Start managing your SIP portfolio with ease</div>

        <h:form>

            <p:messages closable="true" showDetail="true" />

          
            
            <h:panelGroup rendered="#{not empty userManageBean.msg}">
                <div class="error-msg">#{userManageBean.msg}</div>
            </h:panelGroup>


            <p:panelGrid columns="2" style="width:100%;">

                <p:outputLabel for="name" value="Full Name" styleClass="label"/>
                <p:inputText id="name" value="#{userManageBean.fullName}" placeholder="your name"
                             required="true" requiredMessage="Full Name is required."/>

                <p:outputLabel for="email" value="Email" styleClass="label"/>
                <p:inputText id="email" value="#{userManageBean.email}" placeholder="example@mail.com"
                             required="true" requiredMessage="Email is required." validatorMessage="Enter a valid email address">
                    <f:validateRegex pattern="^[^@]+@[^@]+\\.[^@]+$"/>
                </p:inputText>

                <p:outputLabel for="pass" value="Password" styleClass="label"/>
                <p:password id="pass" value="#{userManageBean.password}" placeholder="Create password"
                            feedback="false" required="true" requiredMessage="Password is required." validatorMessage="Password must be at least 6 characters">
                    <f:validateLength minimum="6"/>
                </p:password>

                <p:outputLabel for="phone" value="Phone" styleClass="label"/>
                <p:inputText id="phone" value="#{userManageBean.phone}" placeholder="9876543210" validatorMessage="Phone number must be 10 digits">
                    <f:validateRegex pattern="^[0-9]{10}$"/>
                </p:inputText>

            </p:panelGrid>


            <br/>

            <p:commandButton value="Register"
                             action="#{userManageBean.register}"
                             update="@form"
                             styleClass="p-button-rounded p-button-lg p-button-primary"
                             icon="pi pi-user-plus" />

            <br/><br/>

            <div style="text-align:center;">
                Already have an account?
                <a href="Login.jsf">Login here</a>
            </div>

        </h:form>

    </div>

    <div style="text-align:center; padding:20px 12px; color:#6b7b8a;">
        © 2025 Portfolio SIP Manager — All Rights Reserved
    </div>

</h:body>
</html>
