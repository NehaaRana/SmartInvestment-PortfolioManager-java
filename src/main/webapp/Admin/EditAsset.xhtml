<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
    <ui:composition template="/Admin/AdminLayout.xhtml">
    <ui:define name="title">
        Edit Asset
    </ui:define>
       <ui:define name="content">

        <style>

            .page-container {
                max-width: 900px;
                margin: 30px auto;
                padding: 30px;
                background: white;
                border-radius: 12px;
                box-shadow: 0 6px 20px rgba(10, 30, 60, 0.08);
                animation: fadeIn 0.4s ease-in-out;
            }

            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }

            .page-title {
                text-align: center;
                font-size: 26px;
                color: #1e2a47;
                font-weight: 700;
                margin-bottom: 25px;
            }

            .form-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 25px;
            }

            label {
                font-size: 15px;
                font-weight: 600;
                color: #1e2a47;
                margin-bottom: 6px;
                display: block;
            }

            input, select {
                width: 100%;
                padding: 12px;
                border-radius: 6px;
                border: 1px solid #cfd4da;
                background: #fafbfd;
                font-size: 15px;
                transition: border 0.3s ease;
            }

            input:focus, select:focus {
                border-color: #0b76d1;
                outline: none;
                background: white;
            }

            .image-preview-box {
                width: 150px;
                height: 150px;
                border: 2px dashed #b5bfd0;
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #f4f6f9;
                margin-top: 10px;
            }

            #previewImg {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

            .btn-submit {
                margin-top: 30px;
                padding: 14px;
                width: 100%;
                font-size: 18px;
                background: #0b76d1;
                color: white;
                border-radius: 8px;
                border: none;
                cursor: pointer;
                transition: 0.25s;
                font-weight: 600;
            }

            .btn-submit:hover {
                background: #095c9c;
                transform: translateY(-2px);
                box-shadow: 0px 6px 12px rgba(0,0,0,0.15);
            }

        </style>

        <script>
            function previewImage(input) {
                const preview = document.getElementById("previewImg");
                const file = input.files[0];

                if (file) {
                    const reader = new FileReader();
                    reader.onload = e => preview.src = e.target.result;
                    reader.readAsDataURL(file);
                }
            }
        </script>

        <div class="page-container">

            <h:form enctype="multipart/form-data">

                <div class="page-title">Edit Asset</div>

                <div class="form-grid">

                    <!-- SYMBOL IMAGE -->
                    <div>
                        <label>Symbol Image:</label>

                        <h:inputFile value="#{assetManagedBean.symbolImage}"
                                     onchange="previewImage(this)" />

                        <div class="image-preview-box">
                            <img id="previewImg"
                                 src="/resources/assets/#{assetManagedBean.symbol}"
                                 alt="Asset Preview" />
                        </div>
                    </div>

                    <!-- ASSET NAME -->
                    <div>
                        <label>Asset Name:</label>
                        <h:inputText value="#{assetManagedBean.name}" required="true" />
                    </div>

                    <!-- TYPE -->
                    <div>
                        <label>Asset Type:</label>
                        <h:selectOneMenu value="#{assetManagedBean.type}">
                            <f:selectItem itemLabel="-- Select Type --" itemValue="" />
                            <f:selectItem itemLabel="Stock" itemValue="STOCK"/>
                            <f:selectItem itemLabel="Cryptocurrency" itemValue="CRYPTO"/>
                            <f:selectItem itemLabel="Mutual Fund" itemValue="MUTUAL"/>
                            <f:selectItem itemLabel="Commodity" itemValue="COMMODITY"/>
                            <f:selectItem itemLabel="Bond" itemValue="BOND"/>
                        </h:selectOneMenu>
                    </div>

                    <!-- PRICE -->
                    <div>
                        <label>Current Price:</label>
                        <h:inputText value="#{assetManagedBean.current_price}" required="true" />
                    </div>

                    <!-- STATUS -->
                    <div>
                        <label>Status:</label>
                        <h:selectOneMenu value="#{assetManagedBean.status}">
                            <f:selectItem itemValue="ACTIVE" itemLabel="ACTIVE"/>
                            <f:selectItem itemValue="INACTIVE" itemLabel="INACTIVE"/>
                        </h:selectOneMenu>
                    </div>

                    <!-- RISK -->
                    <div>
                        <label>Risk Level:</label>
                        <h:selectOneMenu value="#{assetManagedBean.risk}">
                            <f:selectItem itemValue="LOW" itemLabel="LOW"/>
                            <f:selectItem itemValue="MEDIUM" itemLabel="MEDIUM"/>
                            <f:selectItem itemValue="HIGH" itemLabel="HIGH"/>
                        </h:selectOneMenu>
                    </div>

                </div>

                <!-- SUBMIT BUTTON -->
                <h:commandButton value="Save Changes"
                                 action="#{assetManagedBean.update}"
                                 styleClass="btn-submit" />

            </h:form>

        </div>

    </ui:define>


</ui:composition>


</html>
