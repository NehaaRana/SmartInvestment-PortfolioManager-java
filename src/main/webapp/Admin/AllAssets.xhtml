<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
  <ui:composition template="/Admin/AdminLayout.xhtml">

    <!-- PAGE TITLE -->
    <ui:define name="title">
        All Assets
    </ui:define>
 

    <!-- PAGE MAIN CONTENT -->
 <ui:define name="content">

    <style>
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 600;
            color: #1e2a47;
        }

        .asset-badge {
            background: #0b76d1;
            padding: 6px 12px;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .search-input {
            width: 260px;
        }

        .action-container {
                    display: flex;
                    gap: 2px;              /* spacing between buttons */
                }

         .action-btn {
            padding: 1px 4px !important;
            font-size: 10px !important;
            font-weight:600;
         }
    </style>


    <h:form id="assetForm">
        <p:poll interval="10"
                listener="#{assetManagedBean.loadAssets()}"
        update="assetTable assetForm"
        autoStart="true"/>

        <!-- HEADER WITH BADGE -->
        <div class="page-header">
           
            <span class="asset-badge">
                Total Assets: #{assetManagedBean.assetsList.size()}
            </span>
        </div>

        <!-- ADD BUTTON -->
       <p:button value="Add New Asset"
                    icon="pi pi-plus"
                      outcome="AssetForm"
                      styleClass="btn btn-primary" />


        <br/><br/>



        <br/><br/>
        <p:confirmDialog global="true">
            <p:commandButton value="Yes"
                             type="button"
                             styleClass="ui-confirmdialog-yes p-button-success" />
            <p:commandButton value="No"
                             type="button"
                             styleClass="ui-confirmdialog-no p-button-danger" />
        </p:confirmDialog>

        <!-- PRIMEFACES DATATABLE -->
        <p:dataTable id="assetTable"
                     var="a"
                     widgetVar="assetTable"
                     value="#{assetManagedBean.assetsList}"
                     paginator="true"
                     rows="10"
                     rowsPerPageTemplate="5,10,20"
                     stripedRows="true"
                     rowKey="#{a.aid}"
                     emptyMessage="No assets found">

            <!-- ID -->
            <p:column headerText="ID" sortBy="#{a.aid}" filterBy="#{a.aid}">
                #{a.aid}
            </p:column>

            <!-- IMAGE -->
            <p:column headerText="Image" style="width:90px;">
                <h:graphicImage library="assets"
                                name="#{a.symbol}"
                                width="60"
                                height="60"/>
            </p:column>

            <!-- NAME -->
            <p:column headerText="Name" sortBy="#{a.name}" filterBy="#{a.name}">
                #{a.name}
            </p:column>

            <!-- TYPE -->
            <p:column headerText="Type" sortBy="#{a.type}" filterBy="#{a.type}">
                #{a.type}
            </p:column>

            <!-- PRICE -->
            <p:column headerText="Price" sortBy="#{a.currentPrice}">
                ₹<h:outputText value="#{a.currentPrice}">
                        <f:convertNumber minFractionDigits="2"
                                         maxFractionDigits="2"
                                         groupingUsed="true"/>
                    </h:outputText>
            </p:column>

            <!-- STATUS -->
            <p:column headerText="Status" filterBy="#{a.status}">
                #{a.status}
            </p:column>

            <!-- RISK -->
            <p:column headerText="Risk" sortBy="#{a.risk}">
                #{a.risk}
            </p:column>

            <!-- CREATED -->
            <p:column headerText="Created" sortBy="#{a.createdAt}">
                <h:outputText value="#{a.createdAt}">
                    <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss"/>
                </h:outputText>
            </p:column>

            <!-- ACTIONS -->
            <p:column headerText="Actions" style="width:200px;">
               <div class="action-container">

                    <p:commandButton value="Update"
                                     icon="pi pi-pencil"
                                     action="#{assetManagedBean.edit(a.aid)}"
                                     styleClass="btn btn-primary action-btn"
                                     update="@form"/>

                    <p:commandButton value="Delete"
                                     icon="pi pi-trash"
                                     action="#{assetManagedBean.deleteAsset(a.aid)}"
                                     styleClass="btn btn-danger action-btn">
                        <p:confirm header="Confirm Delete"
                                message="Are you sure you want to delete this asset?"
                                icon="pi pi-exclamation-triangle" />

                 </p:commandButton>
               </div>
            </p:column>

        </p:dataTable>

    </h:form>

</ui:define>


</ui:composition>
</html>
