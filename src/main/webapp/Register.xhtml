<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
    <h:head>
        <!--<title>Facelet Title</title>-->
        <title>User Registration</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; }
        .card {
            width: 380px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            box-shadow: 0 0 10px #bbb;
            border-radius: 8px;
        }
        .title { font-size: 22px; font-weight: bold; margin-bottom: 20px; text-align:center; }
        .btn {
            width: 100%;
            padding: 10px;
            background: #007bff;
            border: none;
            color: white;
            cursor: pointer;
            margin-top: 15px;
        }
        .msg { color: red; margin-bottom: 10px; text-align:center; font-weight:bold; }
    </style>
    </h:head>
    <h:body>
        <div class="card">

            <div class="title">User Registration</div>

            <!-- Display message -->
            <h:panelGroup rendered="#{not empty userManageBean.msg}">
                <div class="msg">#{userManageBean.msg}</div>
            </h:panelGroup>

            <h:form>

                <h:panelGrid columns="2" columnClasses="label,value" style="width:100%;">

                    <h:outputLabel value="Full Name:" />
                    <h:inputText value="#{userManageBean.fullName}" required="true"
                                 requiredMessage="Full name is required" />

                    <h:outputLabel value="Email:" />
                    <h:inputText value="#{userManageBean.email}" required="true"
                                 requiredMessage="Email is required">
                        <!--<f:validateRegex pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$" />-->
                        
                    </h:inputText>

                    <h:outputLabel value="Password:" />
                    <h:inputSecret value="#{userManageBean.password}" required="true"
                                   requiredMessage="Password is required" />

                    <h:outputLabel value="Phone:" />
                    <h:inputText value="#{userManageBean.phone}" />
                </h:panelGrid>

                <!-- Buttons -->
                <h:commandButton value="Register" action="#{userManageBean.register}" 
                                 styleClass="btn"/>

                <br/><br/>

                <h:link value="Already have an account? Login" outcome="Login" />

            </h:form>

        </div>
        <!--Hello from Facelets-->
    </h:body>
</html>
