<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">
  <ui:composition template="/Admin/AdminLayout.xhtml">
    <ui:define name="title">
        Transactions List
    </ui:define>

    <ui:define name="content">

        <h:head>
            <title>All Transactions</title>

            <style>
                .table {
                    width: 100%;
                    border-collapse: collapse;
                    margin-top: 15px;
                }

                .table th {
                    background-color: #333;
                    color: #fff;
                    padding: 10px;
                    border: 1px solid #555;
                }

                .table td {
                    padding: 10px;
                    border: 1px solid #aaa;
                }

                .badge {
                    padding: 6px 10px;
                    border-radius: 6px;
                    color: white;
                    font-weight: bold;
                }

                .credit { background: green; }
                .debit { background: red; }
                .completed { background: #28a745; }
                .pending { background: orange; }
                .failed { background: red; }
            </style>
        </h:head>

        <h:body>

            <h2>Transactions List</h2>

            <h:form>

                <h:dataTable value="#{adminPaymentTransaction.transactionList}" 
                             var="t" 
                             styleClass="table">

                    <h:column>
                        <f:facet name="header">Txn ID</f:facet>
                        #{t.tid}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Order ID</f:facet>
                        #{t.oid.oid}
                    </h:column>

                    <h:column>
                        <f:facet name="header">User</f:facet>
                        #{t.uid.fullName}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Amount</f:facet>
                        ₹ #{t.amount}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Type</f:facet>
                       
                            #{t.txnType.toUpperCase()}
                      
                    </h:column>

                    <h:column>
                        <f:facet name="header">Status</f:facet>
                     
                            #{t.status}
                     
                    </h:column>

                    <h:column>
                        <f:facet name="header">Date</f:facet>
                        <h:outputText value="#{t.createdAt}">
                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss"/>
                        </h:outputText>
                    </h:column>

                </h:dataTable>

            </h:form>

        </h:body>

    </ui:define>
</ui:composition>
</html>
