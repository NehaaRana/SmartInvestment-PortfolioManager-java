<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition template="/Admin/AdminLayout.xhtml">
    <ui:define name="title">
        WithDrawl List
    </ui:define>
    <ui:define name="content">

        <h:head>
            <title>Withdrawals</title>
            <style>
                body {
                    font-family: Arial, sans-serif;
                    padding: 20px;
                }

                .placeholder {
                    margin-top: 50px;
                    text-align: center;
                    color: #555;
                    font-size: 18px;
                }
            </style>
        </h:head>

        <h:body>
        <p:growl id="msg" showDetail="true" life="3000" sticky="false" globalOnly="true" />

            <h2>Withdrawals</h2>
            <h:form id="redemptionForm">
                <p:growl id="msg" showDetail="true"/>
                
                <p:dataTable value="#{redemptionBean.redemptionList}" var="r" paginator="true" rows="10" style="width: 100%">
                    <p:column headerText="ID">
                        #{r.rid}
                    </p:column>
                    <p:column headerText=" UserID">
                        #{r.uid.fullName}
                    </p:column>
                    <p:column headerText="Asset ID">
                        #{r.aid.name}
                    </p:column>
                    <p:column headerText="Units">
                        #{r.units}
                    </p:column>
                    <p:column headerText="Amount">
                        #{r.redemptionAmount}
                    </p:column>
                    <p:column headerText="Status">
                        #{r.status}
                    </p:column>
                    <p:column headerText="Actions">
                        <p:commandButton value="Approve" icon="pi pi-check"
                                         update="msg redemptionForm" 
                                         actionListener="#{redemptionBean.approve(r)}"
                                         rendered="#{r.status eq 'PENDING'}"/>
                        <p:commandButton value="Reject" icon="pi pi-check"
                                         update="msg redemptionForm" 
                                         actionListener="#{redemptionBean.reject(r)}"
                                         style="margin-left: 5px"
                                         rendered="#{r.status eq 'PENDING'}"/>
                    </p:column>
                </p:dataTable>
            </h:form>
        </h:body>

    </ui:define>

</ui:composition>
</html>
