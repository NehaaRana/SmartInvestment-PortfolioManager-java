<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>User Dashboard — Smart Investment Portfolio</title>

    <style>
        body {
            margin:0;
            background:#f4f6f9;
            font-family: "Inter","Poppins",sans-serif;
            overflow-x:hidden;
        }

        .main-content {
            margin-left:240px;
            margin-top:85px;
            padding:25px;
            transition:margin-left .3s;
        }

        .collapsed-main {
            margin-left:80px;
        }

        .cards {
            display:flex;
            gap:20px;
            flex-wrap:wrap;
        }

        .card {
            background:white;
            padding:20px;
            border-radius:12px;
            flex:1;
            min-width:220px;
            box-shadow:0 2px 8px rgba(0,0,0,0.15);
        }

        .card h3 { margin:0; font-size:18px; color:#0b69ff; }
        .card h2 { margin-top:10px; font-size:26px; font-weight:800; }

        .chart-box {
            background:white;
            padding:25px;
            margin-top:30px;
            border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.15);
        }
    </style>

    <script>
        function adjustContent() {
            const sidebar = document.getElementById("sidebar");
            const content = document.getElementById("main-content");

            if (sidebar.classList.contains("collapsed")) {
                content.classList.add("collapsed-main");
            } else {
                content.classList.remove("collapsed-main");
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            setInterval(adjustContent, 200);
        });
    </script>
</h:head>



<h:body>

    <!-- =============== NAVBAR INCLUDE =============== -->
    <ui:include src="/Navbar.xhtml"/>

    <!-- =============== SIDEBAR INCLUDE =============== -->
    <ui:include src="/Sidebar.xhtml"/>

    <p:poll interval="2"
        listener="#{userDashboardBean.calculateDashboard}"
        update="dashboardPanel portfolioChart" />

    <!-- =============== MAIN CONTENT =============== -->
    <div id="main-content" class="main-content">

        <h2 style="font-weight:800; color:#083560;">Welcome, #{profileBean.fullName}</h2>
        <p style="color:#666; margin-bottom:25px;">Track your investments - portfolio progress.</p>
        <h:panelGroup id="dashboardPanel">
        <!-- DASHBOARD CARDS -->
        <div class="cards">
            <div class="card">
                <h3>Total Investment</h3>
                <h2>₹
                    <h:outputText value=" #{userDashboardBean.totalInvested}">
                        <f:convertNumber minFractionDigits="2"
                                         maxFractionDigits="2"
                                         groupingUsed="true"/>
                    </h:outputText>
                </h2>
            </div>

            <div class="card">
                <h3>Profit Loss</h3>
                <h2>₹ 
                    
                    <h:outputText value="#{userDashboardBean.profitLoss}">
                        <f:convertNumber minFractionDigits="2"
                                         maxFractionDigits="2"
                                         groupingUsed="true"/>
                    </h:outputText></h2>
            </div>
            
            <div class="card">
                <h3>Current Price</h3>
                <h2>₹ 
                    <h:outputText value="#{userDashboardBean.totalPortfolioValue}">
                        <f:convertNumber minFractionDigits="2"
                                         maxFractionDigits="2"
                                         groupingUsed="true"/>
                    </h:outputText>
                </h2>
            </div>

            <div class="card">
                <h3>Total Redemption</h3>
                <h2>₹ 
                    <h:outputText value="#{userDashboardBean.totalReturns}">
                        <f:convertNumber minFractionDigits="2"
                                         maxFractionDigits="2"
                                         groupingUsed="true"/>
                    </h:outputText>
                </h2>
            </div>

            <div class="card">
                <h3>Completed Orders</h3>
                <h2>#{userDashboardBean.completedOrders}</h2>
            </div>
        </div>
      </h:panelGroup>
        <!-- CHART -->
        <div class="chart-box">
            <h3 style="margin-bottom:15px;">Portfolio Growth</h3>
            <p:lineChart 
                id="portfolioChart"
                model="#{userDashboardBean.portfolioChart}"
                style="width:100%; height:400px;"
            />

        </div>
  
    </div>

</h:body>
</html>
