<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/Admin/AdminLayout.xhtml">
    <ui:define name="title">
        Order List
    </ui:define>
  <ui:define name="content">

    <style>
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 600;
            color: #1e2a47;
        }

        .order-badge {
            background: #0b76d1;
            padding: 6px 12px;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .search-input {
            width: 260px;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 6px;
            color: white;
            font-weight: bold;
        }

        .pending { background: orange; }
        .completed { background: green; }
        .cancelled { background: red; }

        .action-btn {
            margin-right: 8px;
        }
    </style>


    <h:form id="orderForm">

        <!-- HEADER -->
        <div class="page-header">
           
            <span class="order-badge">
                Total Orders: #{orderManagedBean.orderList.size()}
            </span>
        </div>

        <!-- SEARCH BAR -->
<!--        <p:inputText id="globalFilter"
                     placeholder="Search orders..."
                     styleClass="search-input"
                     onkeyup="PF('orderTable').filter()" />-->

        <br/><br/>

        <!-- PRIMEFACES DATATABLE -->
        <p:dataTable id="orderTable"
                     var="o"
                     widgetVar="orderTable"
                     value="#{orderManagedBean.orderList}"
                     paginator="true"
                     rows="10"
                     rowsPerPageTemplate="5,10,20"
                     stripedRows="true"
                     rowKey="#{o.oid}"
                     emptyMessage="No orders found">

            <!-- ORDER ID -->
            <p:column headerText="Order ID" sortBy="#{o.oid}" filterBy="#{o.oid}">
                #{o.oid}
            </p:column>

            <!-- USER NAME -->
            <p:column headerText="User" sortBy="#{o.uid.fullName}" filterBy="#{o.uid.fullName}">
                #{o.uid.fullName}
            </p:column>

            <!-- ASSET -->
            <p:column headerText="Asset" sortBy="#{o.aid.name}" filterBy="#{o.aid.name}">
                #{o.aid.name}
            </p:column>

            <!-- ORDER TYPE -->
            <p:column headerText="Order Type" sortBy="#{o.orderType}" filterBy="#{o.orderType}">
                #{o.orderType}
            </p:column>

            <!-- UNITS -->
            <p:column headerText="Units" sortBy="#{o.units}">
                #{o.units}
            </p:column>

            <!-- AMOUNT -->
            <p:column headerText="Price" sortBy="#{o.amount}">
                #{o.amount}
            </p:column>

            <!-- STATUS -->
            <p:column headerText="Status" filterBy="#{o.status}">
                <span class="status-badge 
                      #{o.status eq 'PENDING' ? 'pending' :
                        o.status eq 'COMPLETED' ? 'completed' :
                        o.status eq 'CANCELLED' ? 'cancelled' : ''}">
                    #{o.status}
                </span>
            </p:column>

            <!-- CREATED -->
            <p:column headerText="Created" sortBy="#{o.createdAt}">
                <h:outputText value="#{o.createdAt}">
                    <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss"/>
                </h:outputText>
            </p:column>

            <!-- ACTIONS -->
<!--            <p:column headerText="Actions" style="width:150px;">

                <p:commandButton value="Delete"
                                 icon="pi pi-trash"
                                 action="#{orderManagedBean.deleteOrder(o.orderId)}"
                                 update="@form"
                                 onclick="return confirm('Delete this order?')"
                                 styleClass="btn btn-danger action-btn"/>

            </p:column>-->

        </p:dataTable>

    </h:form>

</ui:define>


</ui:composition>
</html>
