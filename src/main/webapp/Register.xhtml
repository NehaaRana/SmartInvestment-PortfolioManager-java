<?xml version='1.0' encoding='UTF-8'?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <title>Create Account — Portfolio SIP Manager</title>

   <style>
    body {
        margin:0;
        font-family: "Inter", "Poppins", sans-serif;
        background: linear-gradient(180deg, #e9f2ff 0%, #f6fbff 60%);
        color:#05203a;
    }

    /* Smaller centered glass form box */
    .register-box {
        max-width: 440px;  /* smaller width */
        margin: 80px auto;
        padding: 28px 30px; /* reduced padding */
        border-radius:20px;
        background: rgba(255,255,255,0.78);
        backdrop-filter: blur(12px);
        box-shadow: 0 14px 34px rgba(10,50,120,0.10);
        border: 1px solid rgba(11,105,255,0.10);
        animation: fadeIn 0.7s ease;
        transition: all 0.4s ease;
    }

    .register-box:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 48px rgba(10,50,120,0.15);
    }

    @keyframes fadeIn {
        0% { opacity:0; transform:translateY(20px); }
        100% { opacity:1; transform:translateY(0); }
    }

    .title {
        text-align:center;
        font-size:26px; /* reduced size */
        font-weight:800;
        color:#042a52;
        margin-bottom:4px;
    }

    .subtitle {
        text-align:center;
        color:#5a7184;
        margin-bottom:18px; /* less space */
        font-size:15px;
    }

   .label {
        font-weight:600;
        color:#042a52;
        margin-bottom:2px; /* almost no gap */
        display:block;
        font-size:14px;
    }

    .ui-password-panel input {
        height: 48px !important;
        padding:14px 18px !important;
        font-size:15px !important;
    }

        /* compact inputs */
     .ui-inputfield {
        border-radius:10px !important;
        padding:14px 18px !important; /* taller input */
        height: 48px !important;      /* increased height */
        border:1px solid rgba(0,0,0,0.16) !important;
        transition:0.25s ease;
        width:100%;
        background:#ffffffee !important;
        margin-bottom:6px !important; /* reduced space below input */
        font-size:15px !important;
    }

    .ui-inputfield:focus {
        border-color:#0b69ff !important;
        box-shadow:0 0 0 3px rgba(11,105,255,0.18) !important;
    }

    /* Compact button */
    .p-button-primary {
        background:#0b69ff !important;
        border:none !important;
        padding:10px 16px !important;
        font-size:14px !important;
        font-weight:600 !important;
        border-radius:12px !important;
        width:100%;
        letter-spacing:0.3px;
        transition: background 0.25s ease, transform 0.2s ease;
    }

    .p-button-primary:hover {
        background:#005fe6 !important;
        transform: translateY(-2px);
    }

    a {
        color:#0b69ff;
        font-weight:600;
        text-decoration:none;
    }
    a:hover {
        text-decoration:underline;
    }
</style>


</h:head>

<h:body>

     <!-- NAV -->
    <ui:include src="/Navbar.xhtml"/>


    <!-- REGISTER FORM -->
    <div class="register-box">

        <div class="title">Create Your Account</div>
        <div class="subtitle">Start managing your SIP portfolio with ease</div>

        <h:form>

            <p:messages closable="true" showDetail="true" />

          
            
            <h:panelGroup rendered="#{not empty userManageBean.msg}">
                <div class="error-msg">#{userManageBean.msg}</div>
            </h:panelGroup>


            <p:panelGrid columns="2" style="width:100%;">

                <p:outputLabel for="name" value="Full Name" styleClass="label"/>
                <p:inputText id="name" value="#{userManageBean.fullName}" placeholder="your name"
                             required="true" requiredMessage="Full Name is required."/>

                <p:outputLabel for="email" value="Email" styleClass="label"/>
                <p:inputText id="email" value="#{userManageBean.email}" placeholder="example@mail.com"
                             required="true" requiredMessage="Email is required." validatorMessage="Enter a valid email address">
                    <f:validateRegex pattern="^[^@]+@[^@]+\.[^@]+$"/>
                </p:inputText>

                <p:outputLabel for="pass" value="Password" styleClass="label"/>
                <p:password id="pass" value="#{userManageBean.password}" placeholder="Create password"
                            feedback="false" required="true" requiredMessage="Password is required." validatorMessage="Password must be at least 6 characters">
                    <f:validateLength minimum="6"/>
                </p:password>

                <p:outputLabel for="phone" value="Phone" styleClass="label"/>
                <p:inputText id="phone" value="#{userManageBean.phone}" placeholder="9876543210" validatorMessage="Phone number must be 10 digits">
                    <f:validateRegex pattern="^[0-9]{10}$"/>
                </p:inputText>

            </p:panelGrid>


            <br/>

            <p:commandButton value="Register"
                             action="#{userManageBean.register}"
                             update="@form"
                             styleClass="p-button-rounded p-button-lg p-button-primary"
                             icon="pi pi-user-plus" />

            <br/><br/>

            <div style="text-align:center;">
                Already have an account?
                <a href="Login.jsf">Login here</a>
            </div>

        </h:form>

    </div>

    <div style="text-align:center; padding:20px 12px; color:#6b7b8a;">
        © 2025 Portfolio SIP Manager — All Rights Reserved
    </div>

</h:body>
</html>
