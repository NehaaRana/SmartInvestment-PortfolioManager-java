<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
    <h:head>
        <title>My Payments</title>
        
    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>

         <style>
            body {
                background: #f5f7fa;
                font-family: "Inter", "Poppins", sans-serif;
            }

            .main-content {
                margin-top: 80px;
                margin-left: 260px;
                padding: 20px;
                transition: margin-left 0.3s;
            }

            .collapsed-main {
                margin-left: 80px;
            }

            .header-title {
                font-size: 24px;
                font-weight: bold;
            }

            .card-box {
                background: #ffffff;
                border-radius: 15px;
                padding: 25px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
                margin-bottom: 20px;
            }


            /* STATUS COLORS */
            .status-paid {
                font-weight: bold;
                color: green;
            }
            .status-pending {
                font-weight: bold;
                color: orange;
            }
            .status-failed {
                font-weight: bold;
                color: red;
            }
        </style>
        
         <script>
        function adjustContent() {
            const sidebar = document.getElementById("sidebar");
            const content = document.getElementById("main-content");

            if (sidebar.classList.contains("collapsed")) {
                content.classList.add("collapsed-main");
            } else {
                content.classList.remove("collapsed-main");
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            setInterval(adjustContent, 200);
        });
    </script>
    </h:head>
    <h:body>
        <ui:include src="/Navbar.xhtml"/>
        <!-- =============== SIDEBAR INCLUDE =============== -->
        <ui:include src="/Sidebar.xhtml"/>

      <div id="main-content" class="main-content">
       <div class="mb-4">
            <span class="header-title">My Payments</span>
            <p class="text-muted">Overview of all your payments</p>
        </div>
        
        <div class="card-box">
        <h:form id="paymentForm">

        <p:dataTable value="#{paymentBean.paymentsList}" var="p"
                     paginator="true" rows="10"
                     emptyMessage="No Payments Found">

            <p:column headerText="Payment ID">
                #{p.pid}
            </p:column>

            <p:column headerText="Transaction ID">
                #{p.tid.tid}
            </p:column>

            <p:column headerText="Method">
                #{p.method}
            </p:column>

            <p:column headerText="Reference No">
                #{p.referenceNo}
            </p:column>

            <p:column headerText="Status">
                <span style="color:green;font-weight:bold">
                    #{p.status}
                </span>
            </p:column>

            <p:column headerText="Date">
                        <h:outputText value="#{p.createdAt}">
                            <f:convertDateTime pattern="dd-MM-yyyy hh:mm a"/>
                        </h:outputText>
                    </p:column>

        </p:dataTable>

        </h:form>
        </div>

    </div>

    </h:body>
</html>
