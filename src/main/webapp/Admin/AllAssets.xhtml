<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <h:head>
        <title>All Assets</title>
        <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .assetTable {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .assetTable th {
            background-color: #333;
            color: #fff;
            padding: 10px;
            border: 1px solid #555;
        }

        .assetTable td {
            padding: 10px;
            border: 1px solid #aaa;
        }

        .btn {
            background-color: #2c7;
            padding: 6px 12px;
            color: white;
            border: none;
            border-radius: 5px;
            margin-right: 4px;
        }

        .btn.delete {
            background-color: #d33;
        }

        h2 {
            margin-bottom: 20px;
        }
    </style>
    </h:head>
    <h:body>
       <h2>All Asset List</h2>

<h:form>

    <h:commandLink value="➕ Add New Asset"
                   action="AssetForm?faces-redirect=true"
                   style="font-size:16px; text-decoration:none; padding:8px; background:#337ab7; color:white; border-radius:5px;" />

    <br/><br/>

    <h:dataTable value="#{assetManagedBean.assetsList}" 
                 var="asset" 
                 styleClass="assetTable">

        <!-- AID -->
        <h:column>
            <f:facet name="header">ID</f:facet>
            #{asset.aid}
        </h:column>

        <!-- IMAGE -->
        <h:column>
            <f:facet name="header">Image</f:facet>
<!--            <h:graphicImage value="/resources/assets/#{asset.symbol}"

                            width="60" height="60" />-->


            <h:graphicImage library="assets" name="#{asset.symbol}" width="60" height="60" />

        </h:column>

        <!-- NAME -->
        <h:column>
            <f:facet name="header">Name</f:facet>
            #{asset.name}
        </h:column>

        <!-- TYPE -->
        <h:column>
            <f:facet name="header">Type</f:facet>
            #{asset.type}
        </h:column>

        <!-- PRICE -->
        <h:column>
            <f:facet name="header">Price</f:facet>
            #{asset.currentPrice}
        </h:column>

        <!-- STATUS -->
        <h:column>
            <f:facet name="header">Status</f:facet>
            #{asset.status}
        </h:column>

        <!-- RISK -->
        <h:column>
            <f:facet name="header">Risk</f:facet>
            #{asset.risk}
        </h:column>

        <!-- CREATED AT -->
        <h:column>
            <f:facet name="header">Created</f:facet>
            <h:outputText value="#{asset.createdAt}">
                <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss"/>
            </h:outputText>
        </h:column>

        <!-- ACTIONS -->
        <h:column>
            <f:facet name="header">Action</f:facet>

            <h:commandButton value="Update"
                             action="#{assetManagedBean.edit(asset.aid)}"
                             styleClass="btn"/>

            <h:commandButton value="Delete"
                             action="#{assetManagedBean.deleteAsset(asset.aid)}"
                             onclick="return confirm('Are you sure you want to delete this asset?');"
                             styleClass="btn delete"/>
        </h:column>

    </h:dataTable>

</h:form>
        
<!--        <h3>Debug Session Values</h3>

        <p>Email: <h:outputText value="#{keepRecord.email}" /></p>
        <p>Token: <h:outputText value="#{keepRecord.token}" /></p>
        <p>Principal: <h:outputText value="#{keepRecord.principal.name}" /></p>
        <p>Roles: <h:outputText value="#{keepRecord.roles}" /></p>
        <p>Result: <h:outputText value="#{keepRecord.result.status}" /></p>-->

    </h:body>
</html>
