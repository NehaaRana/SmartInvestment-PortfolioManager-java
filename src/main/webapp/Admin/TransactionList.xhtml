<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
  <ui:composition template="/Admin/AdminLayout.xhtml">
    <ui:define name="title">
        Transactions List
    </ui:define>

    <ui:define name="content">

        <style>
            .page-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 20px;
            }

            .page-title {
                font-size: 22px;
                font-weight: 600;
                color: #1e2a47;
            }

            .txn-badge {
                background: #0b76d1;
                padding: 6px 12px;
                border-radius: 6px;
                color: white;
                font-weight: 600;
                font-size: 14px;
            }

            .search-input {
                width: 260px;
            }

            /* Common badge */
            .status-badge {
                padding: 4px 8px;
                border-radius: 6px;
                color: #fff;
                font-weight: bold;
                white-space: nowrap;
                display: inline-block;
                font-size: 12px;
            }

            /* Payment method colors */
            .credit-card {
                background: #0d6efd; /* blue */
            }

            .debit-card {
                background: #dc3545; /* red */
            }

            .upi {
                background: #6f42c1; /* purple */
            }

            .net-banking {
                background: #20c997; /* teal */
            }

            .success {
                background: #28a745; /* green */
            }

            .pending {
                background: orange;
            }

            .failed {
                background: red;
            }

            .canceled {
                background: #6c757d; /* grey */
            }


            

            

        </style>

        <h:form id="txnForm">

            <!-- ===== HEADER ===== -->
            <div class="page-header">

                <span class="txn-badge">
                    Total Transactions: #{adminPaymentTransaction.transactionList.size()}
                </span>
            </div>


            <br/><br/>

            <!-- ===== TRANSACTION TABLE ===== -->
            <p:dataTable id="txnTable"
                         var="t"
                         widgetVar="txnTable"
                         value="#{adminPaymentTransaction.transactionList}"
                         paginator="true"
                         rows="10"
                         rowsPerPageTemplate="5,10,20"
                         stripedRows="true"
                         rowKey="#{t.tid}"
                         emptyMessage="No transactions found">

                <!-- Txn ID -->
                <p:column headerText="Txn ID" sortBy="#{t.tid}" filterBy="#{t.tid}">
                    #{t.tid}
                </p:column>

                <!-- Order ID -->
                <p:column headerText="Order ID" sortBy="#{t.oid.oid}" filterBy="#{t.oid.oid}">
                    #{t.oid.oid}
                </p:column>

                <!-- USER NAME -->
                <p:column headerText="User" sortBy="#{t.uid.fullName}" filterBy="#{t.uid.fullName}">
                    #{t.uid.fullName}
                </p:column>

                <!-- AMOUNT -->
                <p:column headerText="Amount" sortBy="#{t.amount}">
                    ₹<h:outputText value="#{t.amount}">
                        <f:convertNumber minFractionDigits="2"
                                         maxFractionDigits="2"
                                         groupingUsed="true"/>
                    </h:outputText>
                </p:column>

                <!-- TYPE -->
                <p:column headerText="Type" filterBy="#{t.txnType}">
                    <span class="status-badge   #{t.txnType eq 'CREDIT CARD' ? 'credit-card' :
                                t.txnType eq 'DEBIT CARD' ? 'debit-card' :
                                t.txnType eq 'UPI' ? 'upi' :
                                t.txnType eq 'NET BANKING' ? 'net-banking' : ''}">
                        #{t.txnType.toUpperCase()}
                    </span>
                </p:column>

                <!-- STATUS -->
                <p:column headerText="Status" filterBy="#{t.status}">
                    <span class="status-badge 
                          #{t.status eq 'SUCCESS' ? 'success' :
                            t.status eq 'PENDING' ? 'pending' :
                            t.status eq 'FAILED' ? 'failed' :
                            t.status eq 'CANCELED' ? 'canceled' : ''}">
                        #{t.status}
                    </span>
                </p:column>

                <!-- DATE -->
                <p:column headerText="Date" sortBy="#{t.createdAt}">
                    <h:outputText value="#{t.createdAt}">
                        <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss"/>
                    </h:outputText>
                </p:column>

            </p:dataTable>

        </h:form>

    </ui:define>
</ui:composition>
</html>
