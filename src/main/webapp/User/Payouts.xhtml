<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">
    <h:head>
          <title>My Payouts</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>

    <style>
        body {
            background: #f5f7fa;
        }
        .payout-card {
            border-radius: 15px;
            background: #ffffff;
            padding: 25px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.08);
        }
        .table thead {
            background: #eef1f5;
        }
        .header-title {
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</h:head>

<h:body>
    <ui:include src="/Navbar.xhtml"/>

    <div class="container mt-4">

        <!-- PAGE HEADER -->
        <div class="mb-4">
            <span class="header-title"> Your Payouts</span>
            <p class="text-muted">Overview of your completed payouts</p>
        </div>

        <div class="payout-card">

            <!-- Payout Table -->
            <h:dataTable value="#{payoutBean.userPayoutList}" var="p"
                         styleClass="table table-bordered table-hover">

                <h:column>
                    <f:facet name="header">Payout ID</f:facet>
                    #{p.payId}
                </h:column>

                <h:column>
                    <f:facet name="header">Amount</f:facet>
                    ₹ #{p.amount}
                </h:column>

                <h:column>
                    <f:facet name="header">Status</f:facet>
                    #{p.status}
                </h:column>

                <h:column>
                    <f:facet name="header">Date</f:facet>
                    <h:outputText value="#{p.createdAt}">
                        <f:convertDateTime pattern="dd MMM yyyy"/>
                    </h:outputText>
                </h:column>

            </h:dataTable>

            <!-- No Data Message -->
            <h:panelGroup rendered="#{empty payoutBean.userPayoutList}">
                <div class="alert alert-info text-center mt-3">
                    No payouts found.
                </div>
            </h:panelGroup>

        </div>
    </div>
</h:body>
</html>
