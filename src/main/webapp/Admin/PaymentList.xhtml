<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="/Admin/AdminLayout.xhtml">
    <ui:define name="title">
        Payments List
    </ui:define>

    <ui:define name="content">

        <h:head>
            <title>All Payments</title>

            <style>
                .table {
                    width: 100%;
                    border-collapse: collapse;
                    margin-top: 15px;
                }
                .table th {
                    background-color: #333;
                    color: white;
                    padding: 10px;
                    border: 1px solid #555;
                }
                .table td {
                    padding: 10px;
                    border: 1px solid #aaa;
                }
                .badge {
                    padding: 6px 10px;
                    border-radius: 6px;
                    color: white;
                    font-weight: bold;
                }
                .success { background: green; }
                .pending { background: orange; }
                .failed { background: red; }
            </style>
        </h:head>

        <h:body>

            <h2>Payments List</h2>

            <h:form>

                <h:dataTable value="#{adminPaymentTransaction.paymentsList}" 
                             var="p"
                             styleClass="table">

                    <h:column>
                        <f:facet name="header">Payment ID</f:facet>
                        #{p.pid}
                    </h:column>

                    <h:column>
                        <f:facet name="header">User</f:facet>
                        #{p.uid.fullName}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Transaction ID</f:facet>
                        #{p.tid}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Method</f:facet>
                        #{p.method}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Reference No</f:facet>
                        #{p.referenceNo}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Status</f:facet>
                        <span class="badge #{p.status.toLowerCase()}">
                            #{p.status}
                        </span>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Date</f:facet>
                        <h:outputText value="#{p.createdAt}">
                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss"/>
                        </h:outputText>
                    </h:column>

                </h:dataTable>

            </h:form>

        </h:body>

    </ui:define>
</ui:composition>
</html>
