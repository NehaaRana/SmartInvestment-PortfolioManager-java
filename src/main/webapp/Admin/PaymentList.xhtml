<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition template="/Admin/AdminLayout.xhtml">
    <ui:define name="title">
        Payments List
    </ui:define>

     <ui:define name="content">

        <style>
            .page-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 20px;
            }

            .page-title {
                font-size: 22px;
                font-weight: 600;
                color: #1e2a47;
            }

            .payment-badge {
                background: #0b76d1;
                padding: 6px 12px;
                border-radius: 6px;
                color: white;
                font-weight: 600;
                font-size: 14px;
            }

            .search-input {
                width: 260px;
            }

            .status-badge {
                padding: 6px 12px;
                border-radius: 6px;
                color: white;
                font-weight: bold;
                white-space: nowrap;
                display: inline-block;
            }

            .success { background: #28a745; }
            .pending { background: orange; }
            .failed  { background: #d9534f; }
        </style>

        <h:form id="paymentForm">

            <!-- HEADER -->
            <div class="page-header">
               
                <span class="payment-badge">
                    Total Payments: #{adminPaymentTransaction.paymentsList.size()}
                </span>
            </div>

            <br/><br/>

            <!-- PAYMENT TABLE -->
            <p:dataTable id="paymentTable"
                         var="p"
                         widgetVar="paymentTable"
                         value="#{adminPaymentTransaction.paymentsList}"
                         paginator="true"
                         rows="10"
                         rowsPerPageTemplate="5,10,20"
                         stripedRows="true"
                         rowKey="#{p.pid}"
                         emptyMessage="No payments found">

                <!-- Payment ID -->
                <p:column headerText="Payment ID" sortBy="#{p.pid}" filterBy="#{p.pid}">
                    #{p.pid}
                </p:column>

                <!-- User -->
                <p:column headerText="User" sortBy="#{p.uid.fullName}" filterBy="#{p.uid.fullName}">
                    #{p.uid.fullName}
                </p:column>

                <!-- Transaction ID -->
                <p:column headerText="Transaction ID" sortBy="#{p.tid}" filterBy="#{p.tid}">
                    #{p.tid.tid}
                </p:column>

                <!-- Method -->
                <p:column headerText="Method" sortBy="#{p.method}" filterBy="#{p.method}">
                    #{p.method}
                </p:column>

                <!-- Reference Number -->
                <p:column headerText="Reference No" sortBy="#{p.referenceNo}" filterBy="#{p.referenceNo}">
                    #{p.referenceNo}
                </p:column>

                <!-- Status -->
                <p:column headerText="Status" filterBy="#{p.status}">
                    <span class="status-badge 
                            #{p.status eq 'SUCCESS' ? 'success' : 
                              p.status eq 'PENDING' ? 'pending' : 
                              'failed'}">
                        #{p.status}
                    </span>
                </p:column>

                <!-- Date -->
                <p:column headerText="Date" sortBy="#{p.createdAt}">
                    <h:outputText value="#{p.createdAt}">
                        <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss"/>
                    </h:outputText>
                </p:column>

            </p:dataTable>

        </h:form>

    </ui:define>
        
</ui:composition>
</html>
