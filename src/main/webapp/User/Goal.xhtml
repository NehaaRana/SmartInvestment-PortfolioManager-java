<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>User Goals</title>
    
     <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>

    <style>
        body {
            background: #f5f7fa;
            font-family: "Inter", "Poppins", sans-serif;
        }

        .main-content {
            margin-top: 80px; 
            margin-left: 260px;
            padding: 20px;
            transition: margin-left 0.3s;
        }

        .collapsed-main {
            margin-left: 80px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #333;
        }

        .card-box {
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .goal-form-grid .ui-panelgrid-cell {
            padding: 10px 0;
        }

        .add-money-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .progress-done {
            font-weight: bold;
            color: green;
            margin-left: 10px;
        }

        .table thead {
            background: #eef1f5;
        }

        .table td, .table th {
            vertical-align: middle;
        }

        p:progressBar {
            height: 25px;
        }
    </style>

    <script>
        function adjustContent() {
            const sidebar = document.getElementById("sidebar");
            const content = document.getElementById("main-content");

            if (sidebar.classList.contains("collapsed")) {
                content.classList.add("collapsed-main");
            } else {
                content.classList.remove("collapsed-main");
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            setInterval(adjustContent, 200);
        });
    </script>
</h:head>

<h:body>
    <ui:include src="/Navbar.xhtml"/>
    <!-- =============== SIDEBAR INCLUDE =============== -->
    <ui:include src="/Sidebar.xhtml"/>
    <div id="main-content" class="main-content">
    <div class="card-box">
        <h2 class="page-title">Create New Goal</h2>

    <!-- Create Goal Form -->
    <h:form id="goalForm">
     
        <p:panelGrid columns="2" styleClass="goal-form-grid" style="width:50%">
            <p:outputLabel value="Goal Name:" />
            <p:inputText value="#{goalBean.goalName}" required="true" requiredMessage="Goal Name is required"/>

            <p:outputLabel value="Target Amount:" />
            <p:inputText value="#{goalBean.targetAmt}" required="true" requiredMessage="Target Amount is required"/>

            <p:outputLabel value="Target Date:" />
            <p:datePicker value="#{goalBean.targetDate}" pattern="yyyy-MM-dd" required="true" requiredMessage="Target Date is required"/>
        </p:panelGrid>

        <p:commandButton value="Create Goal"
                         action="#{goalBean.createGoal}"
                         update=":goalTableForm:goalTable :goalForm:goalMessages"
                         style="margin-top:10px"/>

       <p:growl id="goalMessages" showDetail="true" life="3000"/>
       
    </h:form>
    
    </div>
    <!-- Display Goals -->
    <div class="card-box">

    <h2 class="page-title">My Goals</h2>

    <h:form id="goalTableForm">
        <p:growl id="goalMessages" showDetail="true" life="3000"/>

        <p:dataTable id="goalTable" value="#{goalBean.goalList}" var="g" style="width:100%"
                     emptyMessage="No Goals Found">
            <p:column headerText="Goal Name">
                #{g.goalName}
            </p:column>

            <p:column headerText="Target Amount">
               
                ₹<h:outputText value="#{g.targetAmt}">
                        <f:convertNumber minFractionDigits="2"
                                         maxFractionDigits="2"
                                         groupingUsed="true"/>
                    </h:outputText>
            </p:column>

            <p:column headerText="Current Amount">
               
                ₹<h:outputText value="#{g.currentAmt}">
                        <f:convertNumber minFractionDigits="2"
                                         maxFractionDigits="2"
                                         groupingUsed="true"/>
                    </h:outputText>
            </p:column>


            <p:column headerText="Progress">
                <p:progressBar 
                    value="#{goalBean.calculateProgress(g)}"
                    displayOnly="true"
                    labelTemplate="{value}%"
                />

                <h:outputText value="Completed"
                            rendered="#{goalBean.calculateProgress(g) == 100}"
                            styleClass="progress-done"/>
            </p:column>

            <p:column headerText="Target Date">
                <h:outputText value="#{g.targetDate}">
                   <f:convertDateTime pattern="dd-MM-yyyy"/>
                </h:outputText>            
            </p:column>
            
            <p:column headerText="Add Money">
                    <p:inputText value="#{goalBean.updateAmounts[g.goalId]}" style="width:70px"/>

                    <p:commandButton value="Add"
                        action="#{goalBean.updateProgress(g.goalId)}"
                        update=":goalTableForm :goalForm"
                        disabled="#{goalBean.calculateProgress(g) == 100}" />
            </p:column>
        </p:dataTable>
    </h:form>
   
    </div>

    </div>

</h:body>
</html>
