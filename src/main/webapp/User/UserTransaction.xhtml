<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <title>My Transaction History</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>

    <style>
        body {
            background: #f5f7fa;
            font-family: "Inter", "Poppins", sans-serif;
        }

        .main-content {
            margin-top: 80px;
            margin-left: 260px;
            padding: 20px;
            transition: margin-left 0.3s;
        }

        .collapsed-main {
            margin-left: 80px;
        }

        .page-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
            color: #333;
        }

        .card-box {
            background: #fff;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .asset-header {
            background: #f1f4f9;
            padding: 12px;
            border-radius: 6px;
            margin-top: 25px;
            font-size: 18px;
            font-weight: 600;
            border-left: 5px solid #1976d2;
        }

        .type-badge {
            background: #4caf50;
            padding: 6px 14px;
            color: white;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .type-badge-sell {
            background: #f44336;
            padding: 6px 14px;
            color: white;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .table-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }

        .divider {
            margin: 25px 0;
            border-top: 1px solid #e0e0e0;
        }

        .p-datatable {
            margin-bottom: 20px;
        }
    </style>

      <script>
        function adjustContent() {
            const sidebar = document.getElementById("sidebar");
            const content = document.getElementById("main-content");

            if (sidebar.classList.contains("collapsed")) {
                content.classList.add("collapsed-main");
            } else {
                content.classList.remove("collapsed-main");
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            setInterval(adjustContent, 200);
        });
    </script>
</h:head>

<h:body> 
    
    
    <ui:include src="/Navbar.xhtml"/>
    <ui:include src="/Sidebar.xhtml"/>
    <div id="main-content" class="main-content">

        <!-- ========== TITLE ========== -->
        <h1 class="page-title">Transaction History (Asset-wise)</h1>
        <h:form>
        <!-- ============ ASSET-WISE TRANSACTIONS ============= -->
        <div class="card-box">
        <!-- Original UI: asset-wise repeat tables -->
            <ui:repeat value="#{orderHistoryBean.uniqueAssets}" var="asset" varStatus="loop">

                <div class="asset-header">#{asset}</div>

                <!-- BUY ORDERS TABLE -->
                <h:panelGroup rendered="#{not empty orderHistoryBean.getOrdersByAsset(asset)}">
                    <div class="table-title">Buy Transactions</div>
                    <p:dataTable value="#{orderHistoryBean.getOrdersByAsset(asset)}" var="o"
                                 paginator="true" rows="5"
                                 styleClass="p-datatable-striped p-datatable-gridlines"
                                 style="margin-bottom:20px">

                        <p:column headerText="Type" style="width: 120px;">
                            <span class="type-badge">BUY</span>
                        </p:column>
                        <p:column headerText="Units"> #{o.units.intValue()} </p:column>
                        <p:column headerText="Amount">  
                            ₹<h:outputText value="#{o.amount}">
                               <f:convertNumber minFractionDigits="2"
                                                maxFractionDigits="2"
                                                groupingUsed="true"/>
                           </h:outputText>
                        
                        </p:column>
                        <p:column headerText="Status"> #{o.status} </p:column>
                        <p:column headerText="Date">
                            <h:outputText value="#{o.createdAt}">
                                <f:convertDateTime pattern="dd MMM yyyy, HH:mm"/>
                            </h:outputText>
                        </p:column>
                    </p:dataTable>
                </h:panelGroup>

                <!-- SELL TABLE -->
                <h:panelGroup rendered="#{not empty orderHistoryBean.getRedemptionsByAsset(asset)}">
                    <div class="table-title">Sell (Redemption) Transactions</div>
                    <p:dataTable value="#{orderHistoryBean.getRedemptionsByAsset(asset)}" var="r"
                                 paginator="true" rows="5"
                                 styleClass="p-datatable-striped p-datatable-gridlines">

                        <p:column headerText="Type" style="width: 120px;">
                            <span class="type-badge-sell">SELL</span>
                        </p:column>
                        <p:column headerText="Units"> #{r.units.intValue()} </p:column>
                        <p:column headerText="Amount">
                            ₹<h:outputText value="#{r.redemptionAmount}">
                               <f:convertNumber minFractionDigits="2"
                                                maxFractionDigits="2"
                                                groupingUsed="true"/>
                           </h:outputText>
                        </p:column>
                        <p:column headerText="Status"> #{r.status} </p:column>
                        <p:column headerText="Date">
                            <h:outputText value="#{r.requestedAt}">
                                <f:convertDateTime pattern="dd MMM yyyy, HH:mm"/>
                            </h:outputText>
                        </p:column>
                    </p:dataTable>
                </h:panelGroup>

                <div class="divider"></div>

            </ui:repeat>
         </div>

        </h:form>
    </div>
</h:body>
</html>
