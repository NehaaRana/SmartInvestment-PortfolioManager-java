<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="jakarta.faces.core">

<div id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <h3>User Panel</h3>
    </div>

    <ul class="menu">
        <li><h:link outcome="UserDashboard"><i class="pi pi-home"></i> Dashboard</h:link></li>
        <li><h:link outcome="Portfolio"><i class="pi pi-briefcase"></i> Portfolio</h:link></li>
        <li><h:link outcome="Orders"><i class="pi pi-shopping-cart"></i> Orders</h:link></li>
        <li><h:link outcome="Payments"><i class="pi pi-credit-card"></i> Payments</h:link></li>
        <li><h:link outcome="Transactions"><i class="pi pi-chart-line"></i> Transactions</h:link></li>
        <li><h:link outcome="Goal"><i class="pi pi-bullseye"></i> Goals</h:link></li>
        <li><h:link outcome="UserTransaction"><i class="pi pi-history"></i> History</h:link></li>
        <li><h:link outcome="Profile"><i class="pi pi-user"></i> Profile</h:link></li>
        <li><h:link outcome="WatchList"><i class="pi pi-star"></i> Watchlist</h:link></li>
        <li><h:link outcome="Payouts"><i class="pi pi-wallet"></i> Payouts</h:link></li>
    </ul>


    <h:form style="padding:20px;">
        <h:commandButton value="Logout"
                         action="#{userDashboardBean.logout}"
                         styleClass="logout-btn"/>
    </h:form>
</div>

<button id="toggleBtn" class="toggle-btn" onclick="toggleSidebar()">☰</button>

<script>
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("collapsed");
    document.getElementById("toggleBtn").classList.toggle("move");
}
</script>

<style>
/* MAIN SIDEBAR */
.sidebar {
    background: #0B1220 !important;   /* Blue Neon Finance Look */
    color: white;
    height: calc(100vh - 70px);
    width: 240px;
    position: fixed;
    top: 70px;
    left: 0;
    transition: transform .3s ease-in-out;
    padding-top: 10px;
    box-shadow: 3px 0 20px rgba(0,0,0,0.5);
    overflow-y: auto;
    overflow-x: hidden;
    border-right: 1px solid rgba(255,255,255,0.05);
}

/* Scrollbar */
.sidebar::-webkit-scrollbar {
    width: 6px;
}
.sidebar::-webkit-scrollbar-thumb {
    background: #334155;
    border-radius: 10px;
}

/* COLLAPSED MODE */
.sidebar.collapsed {
    transform: translateX(-240px);
}

/* TOGGLE BUTTON */
#toggleBtn {
    position: fixed;
    top: 90px;
    left: 200px;
    z-index: 999;
    background: #3B82F6 !important;  /* Blue Neon Button */
    border: none;
    font-size: 22px;
    color: white;
    padding: 10px 14px;
    cursor: pointer;
    border-radius: 10px;
    transition: .3s ease;
    box-shadow: 0 4px 12px rgba(59,130,246,0.45);
}

#toggleBtn:hover {
    background: #2563EB !important; /* Darker blue hover */
}
#toggleBtn.move {
    left: 10px;
}

/* MENU LIST */
.menu {
    list-style: none;
    padding: 0;
    margin-top: 15px;
    font-family: "Inter", sans-serif;
}
.menu li {
    padding: 12px 20px;
    margin: 4px 8px;
    border-radius: 8px;
    transition: .25s;
    cursor: pointer;
}
.menu li a {
    color: #d1d5db;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 12px;
}
.menu li:hover {
    background: rgba(59,130,246,0.15);
    color: white;
    transform: translateX(6px);
    box-shadow: inset 3px 0 0 #3b82f6;
}
.menu li:hover a {
    color: #fff;
}

/* ACTIVE MENU (OPTIONAL) */
.menu li.active {
    background: rgba(59,130,246,0.3);
    box-shadow: inset 3px 0 0 #3b82f6;
}
.menu li.active a {
    color: #fff;
}

/* LOGOUT BUTTON */
.logout-btn {
    width: 88%;
    background: #ef4444;
    border: none;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    color: white;
    margin: 20px auto 10px auto;
    display: block;
    transition: .25s;
}
.logout-btn:hover {
    background: #dc2626;
    transform: translateY(-2px);
}
</style>

</html>
