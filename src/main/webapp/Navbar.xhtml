<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <style>
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 35px;
            background: rgba(255,255,255,0.7);
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            backdrop-filter: blur(8px);
            font-family: "Inter","Poppins",sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 999; 
        }

        .brand {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(90deg,#0b69ff,#00a8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .menu a {
            text-decoration: none;
            padding: 8px 14px;
            color: #083560;
            font-weight: 600;
        }

        .menu a:hover {
            color: #0b69ff;
        }

        .user-email {
            font-weight: 700;
            color:#083560;
            margin-right: 10px;
        }
        
          .user-icon {
        font-size: 22px;
        color: white;
        background: linear-gradient(135deg, #0b69ff, #00a8ff);
        padding: 10px;
        border-radius: 50%;
        box-shadow: 0 4px 15px rgba(0, 136, 255, 0.35);
        transition: 0.3s ease;
        cursor: pointer;
    }

    .user-icon:hover {
        transform: scale(1.12);
        box-shadow: 0 8px 20px rgba(0, 136, 255, 0.45);
    }
    </style>
</h:head>

<h:body>

<!-- ================= NAVBAR ================= -->
<div class="topbar">

    <!-- BRAND -->
    <div class="brand">Smart Investment Portfolio</div>

    <!-- MENU ITEMS -->
    <div class="menu" style="display:flex; gap:15px; align-items:center;">

        <h:link value="Home" outcome="/index" />
        <h:link value="SIP Plans" outcome="/User/ViewPlans" />
        <h:link value="About" outcome="/About" />

        <!-- LOGGED-IN VIEW (ATTRACTIVE NEW UI) -->
        <!-- LOGGED-IN VIEW (Final Clean Version) -->
        <h:panelGroup rendered="#{not empty keepRecord.email}" layout="inline" style="display:flex; align-items:center; gap:15px;">

            <!-- USER ICON (DASHBOARD LINK) -->
            <h:link outcome="/User/UserDashboard" style="text-decoration:none;">
                <i class="pi pi-user user-icon"></i>
            </h:link>

            <!-- LOGOUT BUTTON -->
            <h:form>
                <p:commandButton value="Logout"
                                 action="#{userDashboardBean.logout}"
                                 icon="pi pi-sign-out"
                                 styleClass="p-button-danger p-button-sm" />
            </h:form>

        </h:panelGroup>




        <!-- LOGGED-OUT VIEW -->
        <h:panelGroup rendered="#{empty keepRecord.email}" layout="inline">
            <p:button value="Login" outcome="/Login"
                      icon="pi pi-sign-in"
                      styleClass="p-button-text" />

            <p:button value="Register" outcome="/Register"
                      icon="pi pi-user-plus"
                      styleClass="p-button-outlined p-button-rounded" />
        </h:panelGroup>

    </div>
</div>

</h:body>
</html>
