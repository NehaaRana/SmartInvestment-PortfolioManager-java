<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>My Watchlist</title>
       <!-- Bootstrap -->
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />

    <style>
        body {
            background: #f0f2f5;
            font-family: "Poppins", sans-serif;
        }

        .page-container {
            margin-top: 90px;
            margin-left: 260px;
            padding: 25px;
            transition: margin-left 0.3s;
        }

        .collapsed-main {
            margin-left: 80px;
        }

        .page-title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #333;
        }

        .watchlist-card {
            background: #fff;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .watchlist-table {
            width: 100%;
            border-collapse: collapse;
        }

        .watchlist-table th, .watchlist-table td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            text-align: center;
        }

        .watchlist-table th {
            background-color: #eef1f5;
            font-weight: 600;
        }

        .remove-btn {
            background: #ef4444;
            color: white !important;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
        }

        .empty-msg {
            color: #777;
            font-size: 18px;
            text-align: center;
            margin-top: 20px;
        }

        .asset-img {
            border-radius: 5px;
            width: 50px;
            height: 50px;
        }
    </style>

    <script>
        function adjustContent() {
            var sidebar = document.getElementById("sidebar");
            var content = document.querySelector(".page-container");

            if (sidebar) {
                if (sidebar.classList.contains("collapsed")) {
                    content.classList.add("collapsed-main");
                } else {
                    content.classList.remove("collapsed-main");
                }
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            setInterval(adjustContent, 200);
        });
    </script>
</h:head>
<h:body>

    <!-- Include Navbar -->
    <ui:include src="/Navbar.xhtml" />
     <!-- =============== SIDEBAR INCLUDE =============== -->
    <ui:include src="/Sidebar.xhtml"/>
    
    <p:poll interval="15"
        listener="#{watchListBean.refreshWatchlist}"
        update="watchlistForm:watchTable" />
    
    <!-- MAIN CONTENT AREA -->
    <div class="page-container">

      <div class="page-title">My Watchlist</div>

    <!-- Load watchlist before rendering -->
    <f:metadata>
        <f:event type="preRenderView" listener="#{watchListBean.loadWatchlist}" />
    </f:metadata>

    <h:form id="watchlistForm">

        <!-- Watchlist Table -->
        <h:panelGroup rendered="#{not empty watchListBean.watchlist}">
            <p:dataTable id="watchTable" value="#{watchListBean.watchlist}" var="item" styleClass="watchlist-table">
                <p:column headerText="Asset Name">
                    #{item.aid.name}
                </p:column>
                <p:column headerText="Symbol">
                    <h:graphicImage value="#{resource['assets/'.concat(item.aid.symbol)]}" 
                        width="50"
                        height="50"
                        style="border-radius:5px;" />

                </p:column>
                <p:column headerText="Current Price">
                    
                    ₹<h:outputText value="#{item.aid.currentPrice}">
                               <f:convertNumber minFractionDigits="2"
                                                maxFractionDigits="2"
                                                groupingUsed="true"/>
                           </h:outputText>
                </p:column>
                <p:column headerText="Actions">
                    <p:commandButton value="Remove"
                                     action="#{watchListBean.removeFromWatchlist(item.wid)}"
                                     update="@form"
                                     styleClass="remove-btn" />
                </p:column>
            </p:dataTable>
        </h:panelGroup>

        <!-- Empty Watchlist Message -->
        <h:panelGroup rendered="#{empty watchListBean.watchlist}">
            <div class="empty-msg">Your watchlist is empty.</div>
        </h:panelGroup>

    </h:form>
    
    </div>>
</h:body>
</html>
