<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>User List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .userTable {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .userTable th {
            background-color: #333;
            color: #fff;
            padding: 10px;
            border: 1px solid #555;
        }

        .userTable td {
            padding: 10px;
            border: 1px solid #aaa;
        }

        .btn {
            background-color: #2c7;
            padding: 6px 12px;
            color: white;
            border: none;
            border-radius: 5px;
            margin-right: 4px;
        }

        .btn.delete {
            background-color: #d33;
        }

        h2 {
            margin-bottom: 20px;
        }
    </style>
</h:head>

<h:body>

    <h2>User List</h2>

    <h:form>
         <!-- SEARCH BAR -->
        <div style="margin-bottom:15px;">
            <h:inputText value="#{userManagedBean.searchKeyword}" 
                         style="padding:6px; width:250px; border-radius:4px; border:1px solid #777;">
                <f:ajax event="keyup" 
                        listener="#{userManagedBean.searchUsersAjax}" 
                        render="userTableWrapper" />
            </h:inputText>
        </div>
  <h:panelGroup id="userTableWrapper">
        <h:dataTable value="#{userManagedBean.userList}" 
                     var="u" 
                     styleClass="userTable">

            <!-- UID -->
            <h:column>
                <f:facet name="header">UID</f:facet>
                #{u.uid}
            </h:column>

            <!-- FULL NAME -->
            <h:column>
                <f:facet name="header">Full Name</f:facet>
                #{u.fullName}
            </h:column>

            <!-- EMAIL -->
            <h:column>
                <f:facet name="header">Email</f:facet>
                #{u.email}
            </h:column>

            <!-- ACTION -->
            <h:column>
                <f:facet name="header">Action</f:facet>

                <h:commandButton value="View"
                                 action="#{userManagedBean.viewUser(u.uid)}"
                                 styleClass="btn" />

                <h:commandButton value="Delete"
                                 action="#{userManagedBean.deleteUser(u.uid)}"
                                 onclick="return confirm('Are you sure you want to delete this user?');"
                                 styleClass="btn delete"/>
            </h:column>

        </h:dataTable>
    </h:panelGroup>

    </h:form>

</h:body>
</html>
