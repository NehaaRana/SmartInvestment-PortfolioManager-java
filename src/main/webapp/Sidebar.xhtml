<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="jakarta.faces.core">

<div id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <h3>User Panel</h3>
    </div>

    <ul class="menu">
        <li><h:link outcome="UserDashboard" value="Dashboard"/></li>
        <li><h:link outcome="Portfolio" value="Portfolio"/></li>
        <li><h:link outcome="Orders" value="Orders"/></li>
        <li><h:link outcome="Payments" value="Payments"/></li>
        <li><h:link outcome="Transactions" value="Transactions"/></li>
        <li><h:link outcome="Goals" value="Goals"/></li>
        <li><h:link outcome="Profile" value="Profile"/></li>
        <li><h:link outcome="WatchList" value="Watchlist"/></li>        
        <li><h:link outcome="Payouts" value="Payouts"/></li>

    </ul>

    <h:form style="padding:20px;">
        <h:commandButton value="Logout"
                         action="#{userDashboardBean.logout}"
                         styleClass="logout-btn"/>
    </h:form>
</div>

<button id="toggleBtn" class="toggle-btn" onclick="toggleSidebar()">☰</button>

<script>
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("collapsed");
    document.getElementById("toggleBtn").classList.toggle("move");
}
</script>

<style>
    .sidebar {
    background: #111827;
    color: white;
    height: calc(100vh - 70px); /* reduce height because top:70px */
    width: 230px;
    position: fixed;
    top: 70px;
    left: 0;
    transition: transform .3s ease-in-out;
    padding-top: 10px;
    box-shadow: 2px 0 10px rgba(0,0,0,0.4);

    overflow-y: auto;   /* Enable vertical scroll */
    overflow-x: hidden; /* prevent side scroll */
}
.sidebar::-webkit-scrollbar {
    width: 6px;
}

.sidebar::-webkit-scrollbar-thumb {
    background: #4b5563;
    border-radius: 10px;
}


.sidebar.collapsed {
    transform: translateX(-230px);
}

#toggleBtn {
    position: fixed;
    top: 90px;
    left: 180px;
    z-index: 999;
    background: palevioletred;
    border: none;
    font-size: 22px;
    color: white;
    padding: 8px 12px;
    cursor: pointer;
    border-radius: 6px;
    transition: left .3s ease-in-out;
}

#toggleBtn.move {
    left: 10px;
}

.menu {
    list-style: none;
    padding: 0;
}
.menu li {
    padding: 12px 20px;
}
.menu li a {
    color:#cfd3d8;
    text-decoration:none;
    font-size:16px;
    display:block;
}
.menu li:hover {
    background:#0b69ff;
    border-radius:6px;
}

.logout-btn {
    width: 100%;
    background: #ef4444;
    border: none;
    padding: 10px;
    border-radius: 6px;
    cursor:pointer;
    font-weight: bold;
}
</style>
</html>
